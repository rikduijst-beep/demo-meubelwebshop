s":"voordeel-pakket-meubelolie-vloerolie","par":67,"k":27,"img":""},{"id":348,"n":"Was","s":"was","par":0,"k":26,"img":""},{"id":73,"n":"Wasbeits (met zuivere bijenwas)","s":"wasbeits-zuivere-bijenwas","par":62,"k":8,"img":""},{"id":340,"n":"Watergedragen Lak","s":"watergedragen-lak","par":66,"k":4,"img":""}],"pages":{"zakelijk":{"t":"Van de Specialist vóór de Specialist","h":"<h3>Zakelijk</h3><p>Deze demo bevat geen zakelijke afspraken of kortingscodes.</p>"},"over-ons":{"t":"Contactgegevens","h":"<h3>Over deze demo</h3><p>Dit is een fictieve demo-webshop. Alle bedrijfsgegevens, contactgegevens en productinformatie zijn verzonnen.</p>"},"privacy":{"t":"Privacyverklaring","h":"<h3>Privacyverklaring</h3><p>Deze demo verwerkt geen persoonsgegevens. Er worden geen gegevens opgeslagen of verzonden.</p>"},"algemene-voorwaarden":{"t":"Algemene voorwaarden","h":"<h3>Algemene voorwaarden</h3><p>Deze demo heeft geen geldige algemene voorwaarden. Er kunnen geen echte bestellingen worden geplaatst.</p>"},"bestellen":{"t":"Bestellen","h":"<h3>Bestellen</h3><p>In deze demo kun je geen echte bestellingen plaatsen.</p>"},"retourneren":{"t":"Retourneren","h":"<h3>Retourneren</h3><p>Dit is een demo. Er zijn geen echte retouren.</p>"},"verzending":{"t":"Verzending","h":"<h3>Verzending</h3><p>Verzendkosten in deze demo zijn fictief en worden niet berekend.</p>"}},"posts":[{"t":"Hoe kies je het juiste onderhoudsproduct voor houten meubels?","s":"hoe-kies-je-het-juiste-onderhoudsproduct-voor-houten-meubels","h":"<h2>Hoe kies je het juiste onderhoudsproduct voor jouw houten meubels?</h2> <p>Houten meubels blijven het mooist wanneer ze het juiste onderhoud krijgen. Maar met zoveel producten zoals olie, was, beits en lak is het soms lastig om precies te weten wat jouw meubel nodig heeft. In dit artikel lees je hoe je de beste keuze maakt op basis van houtsoort, gebruik en gewenste uitstraling.</p> <h2>1. Bepaal de houtsoort</h2> <ul> <li><strong>Zachte houtsoorten</strong> zoals grenen en vuren vragen om extra bescherming tegen deuken en vlekken.</li> <li><strong>Harde houtsoorten</strong> zoals eiken, beuken en teak reageren goed op olie of hardwaxolie.</li> </ul> <h2>2. Kies de juiste afwerking</h2> <ul> <li><a href=\"#\" target=\"_blank\" rel=\"noopener\"><strong>Hardwaxolie</strong></a>: natuurlijke uitstraling met extra slijtlaag. Trekt diep in het hout, benadrukt de nerf en beschermt tegen vocht. Ideaal voor meubels en vloeren.</li> <li><a href=\"#\" target=\"_blank\" rel=\"noopener\"><strong>Lak</strong></a>: harde, slijtvaste afwerking voor intensief gebruik.</li> <li><a href=\"#\" target=\"_blank\" rel=\"noopener\"><strong>Beits</strong></a>: geeft kleur, maar moet worden afgewerkt met olie of lak.</li> </ul> <h2>3. Houd rekening met het gebruik</h2> <ul> <li>Eettafels en vloeren → Hardwaxolie of lak</li> <li>Kasten en decoratie en overige meubels → Hardwaxolie of was</li> <li>Buitenmeubels → Buitenolie of Buitenbeits</li> </ul> <h2>Conclusie</h2> <p>Bepaal altijd eerst de houtsoort en het gebruik van je meubel. Zo kies je het juiste onderhoudsproduct dat het hout beschermt én mooi houdt.</p> <strong>Tip:</strong> Bekijk ons assortiment onderhoudsproducten om de perfecte afwerking voor jouw meubels te vinden.","c":["informatie-instructies","nieuwsoverzicht","veelgestelde-vragen"]},{"t":"Hoe kan ik gebrand hout het beste behandelen? ( Shou Sugi Ban )","s":"gebrand-hout-behandelen","h":"<p>Beste Stefan,</p> <p>Bedankt voor uw bericht wat wij van u ontvingen via de chat:</p> <p><strong>Vraag Stefan:</strong></p> <p><strong>Hi! Ik heb m’n vuren balken van m’n plafond gebrand, daarna afgeborsteld waardoor nu die verbrande nerven uitstekend zwart geaccentueerd zijn. (Shou Sugi Ban) Het zachte hout ertussen heeft z’n oude natuurlijke kleur (wit). Wat zou een goede soort olie zijn om mijn balken mee te behandelen?</strong></p> <p><strong>Antwoord Demo Meubelwebshop:</strong></p> <p><strong>Omdat omdat het om meerdere kleuren gaat raden we aan een product te gebruiken waarin geen pigmenten zijn opgenomen omdat deze of het wit of de mooie gebrande kleur zullen maskeren. We raden aan om voor deze toepassing onze Invisible Oil te gebruiken. Deze watergedragen olie geeft, zoals de naam al zegt, een onzichtbare afwerking waardoor de kleuren van het hout bewaard blijven. U kunt dit product vinden via: </strong><strong><a href=\"#\" target=\"_blank\" rel=\"noopener\">#</a></strong></p> <p><strong>Wanneer u voor verdieping in het hout wilt gaan dan kunt u ook voor Hardwaxolie F700 kiezen. Houdt er wel rekening mee dat deze olie niet die blanke afwerking geeft, maar altijd het witte hout iets geler maakt. Hardwaxolie F700 kunt u vinden via: <a href=\"#\" target=\"_blank\" rel=\"noopener\">#</a><br> </strong></p>","c":["informatie-instructies","nieuwsoverzicht","veelgestelde-vragen"]},{"t":"Camperproject van Rob met PU-Lak en Waterbeits","s":"camperproject-pu-lak-en-waterbeits","h":"<p>Sjoerd &#8211; Productspecialist: Welkom bij Demo Meubelwebshop!<br> Kan ik je ergens mee helpen?</p> <p>Rob: Goede morgen,<br> Ik ben bezig met een camper inbouw en wil mijn meubels van populieren multiplex maken zonder HPL toplaag.<br> Omdat dit vrij kwetsbaar hout is ben ik op zoek naar een zeer sterke en krasvaste lak om mee af te lakken.<br> Ik dacht zelf aan een (PU) parketlak, maar wat zouden jullie adviseren?</p> <p>Sjoerd &#8211; Productspecialist : PU-lak is daarvoor inderdaad een zeer goede keuze. Deze lak is flexibel en heeft een hoge slijtvastheid. De sterkste variant van de PU-lak is overigens de oplosmiddel houdende variant. (#</p> <p>Rob: Oké, dat is fijn. Ik neem aan dat de geur na verloop van tijd wel weg gaat.<br> Daarnaast zie ik allerlei merken, jullie hebben een eigen/ huismerk? Zitten hier nog voor of nadelen aan?</p> <p>Sjoerd &#8211; Productspecialist : Ons eigen huismerk is een product van de Vesting en een Lak van een absolute topkwaliteit. Dus zeker aan te raden.</p> <p>Rob: Oké, de prijs is ook gunstig dus dat is mooi. Kan ik deze lak ook over een beits aanbrengen om het hout vooraf te kleuren? En welk soort zou u adviseren?</p> <p>Sjoerd &#8211; Productspecialist : Jazeker, deze lak kan het beste worden aangebracht over een Waterbeits. De hele reeks die we in ons assortiment hebben is hiervoor geschikt.<br> (#</p> <p>Rob : Super! Bedankt voor de snelle reactie, Ik ga even door de kleuren heen kijken en binnen bestellen.<br> Groet, Rob</p> <p>Sjoerd &#8211; Productspecialist : Graag gedaan en succes met het Camper-project!<br> Rob : Bedankt 🙂</p>","c":["informatie-instructies","nieuwsoverzicht","veelgestelde-vragen"]},{"t":"Hoe maak ik mijn hout zwart zonder de houtstructuur te verliezen?","s":"hoe-maak-ik-hout-zwart-zonder-de-houtstructuur-te-verliezen","h":"Klant: Beste, Ik ben al enige tijd verf speciaalzaken aan het afschuimen voor het eboniseren van hout keer op keer kunnen ze me niet verder helpen, en verwijzen meestal naar een zwarte olie o.i.d. Op jullie website zie ik 2 producten die me interesseren en vroeg me af hoe donker het hout ervan wordt <a href=\"#\" target=\"_blank\" rel=\"noopener\">Waterbeits zwart</a> en <a href=\"#\" target=\"_blank\" rel=\"noopener\">P-beits zwart extra</a> de bedoeling is dat de structuur van het hout wordt behouden, maar dat tot de diepste porie alles zwart is gekleurd. <br> Sjoerd &#8211; Productspecialist: Beide soorten zijn een zeer zwarte waterbeits. De P-beits is voorzien van een lichte sealer. Deze beitsen maken het hout echt zwart zwart, maar laten de structuur van het hout in takt. Anders gezegd wordt er geen laag over het hout aangebracht die de nerf bedekt zonder dat dit afbreuk doet op het zwart van de beits.  <p>Klant:</p> <p>Is er een mogelijkheid tot schuren zonder dat het originele kleur van het hout wordt weergegeven? Zoals voorbereiden om het daarna met een PU-lak mat te lakken.</p> Sjoerd &#8211; Productspecialist: Voor dit probleem is onze <a href=\"#\" target=\"_blank\" rel=\"noopener\">Sanding Sealer</a> ontwikkeld. Deze Sealer kun je aanbrengen tussen de beitslaag en de uiteindelijke afwerklaag waardoor het oppervlak te schuren is zonder dat de kleurlaag wordt aangetast. Deze behandeling wordt in de regel alleen gegeven als er wordt gekozen voor een afwerking op waterbasis (zoals bijvoorbeeld onze <a href=\"#\" target=\"_blank\" rel=\"noopener\">PU-Lak Topcoat</a>). Bij afwerking met onze <a href=\"#\" target=\"_blank\" rel=\"noopener\">Hardwaxolie F-serie</a> is dit niet nodig Klant: Bedankt voor de tip, ik bestel beide producten. En wacht nog even af met de sanding sealer.<br> Ik zal het eerst even uitproberen.<br> Bedankt voor de hulp. Sjoerd &#8211; Productspecialist: Graag gedaan en mocht er nog vragen komen, bellen, appen, mailen of chatten kan altijd!","c":["informatie-instructies","nieuwsoverzicht"]},{"t":"Welke afwerking voor Waterbeits?","s":"welke-afwerking-voor-waterbeits","h":"<h2>Vraag:</h2> <p>Goedenavond,</p> <p>Welke afwerking/bescherming raadt u aan:<br> &#8211; wasolie naturel mat 3000-30<br> &#8211; wasolie naturel + KZ</p> <p>Het gaat om een tafel welke donkerder is gemaakt met waterbeits.</p> <p>En ik ben op zoek naar een goede, liefst matte of zijdeglans, beschermlaag. Die beschermt tegen vuil en vocht. Zodat, als er geknoeid wordt met Bv drinken, de tafel niet verkleurt.</p> <p>Ik hoor het graag.</p> <p>Met vr Gr Charlotte van Dalen</p>  <h2>Antwoord:</h2> <p>Voor de afwerking van uw tafel kunt u het beste de <a href=\"#\" target=\"_blank\" rel=\"noopener\">Hardwaxolie F700 Blank Mat</a> of <a href=\"#\" target=\"_blank\" rel=\"noopener\">F700 Blank Zijdeglans</a> gebruiken. De Hardwaxolie F700 Blank geeft een meer dan volwaardige afwerking en bescherming en is uitermate geschikt als beschermlaag tegen vuil en vocht, dus natte glazen en hete theekopjes zijn geen probleem…</p> <p>Team Demo Meubelwebshop</p>","c":["informatie-instructies","nieuwsoverzicht"]},{"t":"Hoe kan ik mijn Cerusé binnendeuren het beste opfrissen?","s":"hoe-kan-ik-mijn-ceruse-binnendeuren-het-beste-opfrissen","h":"<p>Vraag:</p> <p>Beste,</p> <p>Wij hebben cerusé binnendeuren en ik zou die graag opfrissen.<br> Graag de vernis eraf halen dan witte was olie of iets minder wit en dan matte hardwax erover rollen.<br> Of hoe zien jullie dit. Kunnen jullie mij hier info rond geven of een filmpje of kleuren.</p> <p>Mvg mevrouw Jans</p> <p>Antwoord:</p> <p>Beste mevrouw Jans,</p> <p>Bedankt voor uw bericht. Voordat er een nieuwe bescherm of kleurlaag wordt aangebracht is het aan te raden om het hout helemaal kaal te maken zodat een olie en/of beits goed in het hout kan worden opgenomen. U begint na het kaal maken van het hout met het kleuren. Dit kan door middel van een waterbeits of een kleurolie. De keuze daaruit is afhankelijk van het uiteindelijk gewenste resultaat. Een <a href=\"#\" target=\"_blank\" rel=\"noopener\">beits</a> geeft een wat egaler resultaat qua kleur dan een <a href=\"#\" target=\"_blank\" rel=\"noopener\">wasolie</a> of <a href=\"#\" target=\"_blank\" rel=\"noopener\">hardwaxolie</a>.</p> <p>Hieronder staan een paar producten die zouden kunnen worden gebruikt voor het kleuren en afwerken van uw deuren:</p> <p>Kleuren Wasolie:<br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Wasolie Wit Transparant, Wasolie Wit 4231-120 of Wasolie Krijt</a></p> <p>Kleuren Beits:<br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Waterbeit RAL 9010</a><br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Waterbeits Quality Naturals 1100</a><br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Kleurbeits KAT CBM 331 White Wash</a></p> <p>Voor de afwerking bij beits:<br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Sanding Sealer</a> + <a href=\"#\" target=\"_blank\" rel=\"noopener\">Invisible Oil</a></p> <p>Voor afwerking bij Wasolie:<br> <a href=\"#\" target=\"_blank\" rel=\"noopener\">Wasolie Naturel of Wasolie Naturel Mat</a></p> <p>Hopelijk kunt u hier iets mee.</p> <p>Heeft u nog vragen of opmerkingen, bel of mail ons dan gerust.</p> <p>Vriendelijke groet,</p> <p>Team Demo Meubelwebshop</p>","c":["veelgestelde-vragen"]},{"t":"Hoe kan ik mijn houten plafond het beste kleuren en behandelen?","s":"hoe-kan-ik-mijn-houten-plafond-het-beste-kleuren-en-behandelen","h":"<h2>Vraag:</h2> <p>Hallo,</p> <p>Wij zijn bezig een aanbouw aan onze woning. In dit gedeelte komt een plafond met balken en planken in zicht.</p> <p>Het geleverde hout is vuren en moet nog een kleur krijgen. We willen graag de hout structuur en uitstraling behouden, maar het geel van het vuren en verkleuring op termijn heeft niet onze voorkeur.</p> <p>Onze leverancier adviseert ons om het hout in de olie te zetten, in kleur.</p> <p>Nu kijk ik op de site en denk, wat op de vloer kan, kan ook aan het plafond, dus een vloerolie zou prima kunnen. Ik vind het wat lastig om de juiste kleuren te kiezen. We zijn op zoek naar een (donker) eiken kleur voor de dragende balken en een lichte vergrijsde kleur voor de liggende planken.</p> <p>Op het meegestuurd plaatje een voorbeeld (de planken hier zijn wel iets te licht).</p> <p>Kunnen jullie aan de hand van meegestuurde foto een advies kunnen geven? Als ik twee (of drie) kleuren heb, wil ik daarvan graag testpotjes bestellen.</p> <p>Ben benieuwd naar jullie reactie.</p> <p>Hartelijke groet, Henria</p>  <h2>Antwoord:</h2> <p>Beste Henria,</p> <p>Bedankt voor uw mail. Om het vurenhout te kleuren kunt u het beste starten met een <a href=\"#\" target=\"_blank\" rel=\"noopener\">beits</a> en die dan afwerken met een naturel <a href=\"#\" target=\"_blank\" rel=\"noopener\">Hardwaxolie</a>. Voor de planken zijn onze <a href=\"#\" target=\"_blank\" rel=\"noopener\">verouderingsbeitsen</a> wellicht interessant. Om de balken te kleuren kunt u de <a href=\"#\" target=\"_blank\" rel=\"noopener\">waterbeits uit de QN (Quality Naturals) reeks</a> gebruiken. Wanneer u beide delen van het plafond heeft bewerkt met <a href=\"#\" target=\"_blank\" rel=\"noopener\">beits</a> kunt u daarna het hele plafond in één keer afwerken met een Naturel <a href=\"#\" target=\"_blank\" rel=\"noopener\">Hardwaxolie</a>.</p> <p>Het grote voordeel om het hout op kleur te brengen met een <a href=\"#\" target=\"_blank\" rel=\"noopener\">beits</a> is het gemak van het verwerken van de <a href=\"#\" target=\"_blank\" rel=\"noopener\">beits</a>. De uiteindelijke beschermlaag is daarnaast in één keer aan te brengen waardoor de kleur van de verschillende oliesoorten niet met elkaar in aanraking komen.</p> <p>Heeft u nog vragen of opmerkingen, bel of mail ons dan gerust.</p> <p>Vriendelijke groet,</p> <p>Team Demo Meubelwebshop</p>","c":["veelgestelde-vragen"]}]};
</script>
<script>
/* Demo Meubelwebshop — vernieuwde webshop (statische demo, hash-routing) */
(() => {
'use strict';
const D = window.MP_DATA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = c => '€ ' + (c / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover:hover) and (pointer:fine)').matches;
const FREE_FROM = 6500, SHIPPING = 795;
const PH = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#E6E8DA"/><path d="M105 125c0-60 90-60 90 0" fill="none" stroke="#6E7645" stroke-width="8"/><rect x="95" y="120" width="110" height="110" rx="10" fill="#B9BE9C" stroke="#6E7645" stroke-width="8"/></svg>');
const imgErr = `onerror="this.onerror=null;this.src='${PH}'"`;

/* ---------- data-index ---------- */
const bySlug = new Map(D.products.map(p => [p.s, p]));
const byId = new Map(D.products.map(p => [p.id, p]));
const catBySlug = new Map(D.cats.map(c => [c.s, c]));
const catById = new Map(D.cats.map(c => [c.id, c]));
const NAV = [
  ['Meubel & Vloerolie', 'hardwax-olie-f-serie-meubelie-vloerolie'],
  ['Beits', 'hout-kleuren-met-oneindig-veel-kleuren'],
  ['Lak', 'lakken'],
  ['Was', 'was'],
  ['Gereedschap', 'gereedschap'],
  ['Onderhoud / Reparatie', 'onderhoudsmiddelen-en-reparatie'],
  ['Bescherming voor Buiten', 'onderhoud-en-bescherm-je-hout-ook-buiten-demo-meubelwebshop'],
];
const childrenOf = slug => { const c = catBySlug.get(slug); return c ? D.cats.filter(x => x.par === c.id && x.k > 0) : []; };
const inCat = slug => D.products.filter(p => p.c.includes(slug));
const mainCat = p => { const subs = p.c.map(s => catBySlug.get(s)).filter(Boolean); return (subs.find(c => c.par) || subs[0] || { n: '' }).n; };
const INFO = [
  ['bestellen', 'Bestellen'], ['verzending', 'Verzending'], ['retourneren', 'Retourneren'], ['zakelijk', 'Zakelijk'],
  ['over-ons', 'Over Demo Meubelwebshop'], ['veelgestelde-vragen', 'Veelgestelde vragen'], ['contact', 'Contact'],
  ['algemene-voorwaarden', 'Algemene voorwaarden'], ['privacy', 'Privacyverklaring'],
];

/* ---------- toasts ---------- */
function toast(title, sub = '', icon = 'check', ms = 3600) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${ic(icon)}<div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 420); }, ms);
}

/* ---------- winkelmandje (state) ---------- */
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* privémodus */ } },
};
let cart = store.get('mp_cart', []);
let coupon = store.get('mp_coupon', null);
const lineInfo = l => {
  const p = byId.get(l.id); if (!p) return null;
  const v = p.v.find(x => x.id === l.vid) || null;
  return { p, v, price: v ? v.p : p.p, label: v ? v.l : (p.opt ? 'Voordeelpakket' : '') };
};
const totals = () => {
  let sub = 0, count = 0;
  cart.forEach(l => { const i = lineInfo(l); if (i) { sub += i.price * l.q; count += l.q; } });
  const disc = coupon ? Math.round(sub * coupon.pct / 100) : 0;
  const ship = sub === 0 || sub - disc >= FREE_FROM ? 0 : SHIPPING;
  return { sub, count, disc, ship, total: sub - disc + ship };
};
function saveCart() {
  cart = cart.filter(l => l.q > 0 && byId.has(l.id));
  store.set('mp_cart', cart); store.set('mp_coupon', coupon);
  renderCartUI();
  document.dispatchEvent(new CustomEvent('mp:cart', { detail: { cart, totals: totals() } }));
}
function addToCart(id, vid, q = 1, fromEl) {
  const l = cart.find(x => x.id === id && x.vid === vid);
  if (l) l.q += q; else cart.push({ id, vid: vid ?? null, q });
  flyToCan(fromEl);
  saveCart();
  const i = lineInfo({ id, vid });
  toast('In je verfblik', `${q}× ${i.p.n}${i.label ? ' · ' + i.label : ''}`, 'drop');
}
function flyToCan(fromEl) {
  const can = $('#cartBtn'), cr = can.getBoundingClientRect();
  const done = () => {
    can.classList.remove('splash'); void can.offsetWidth; can.classList.add('splash');
    $('#cartCount').classList.remove('bump'); void can.offsetWidth; $('#cartCount').classList.add('bump');
    if (reduced) return;
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('i'); s.className = 'splat';
      s.style.left = cr.left + cr.width / 2 + 'px'; s.style.top = cr.top + cr.height / 2 + 'px';
      document.body.append(s);
      const a = Math.random() * Math.PI * 2, d = 26 + Math.random() * 34;
      s.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 18}px) scale(.3)`, opacity: 0 }], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => s.remove();
    }
  };
  if (!fromEl || reduced) return done();
  const fr = fromEl.getBoundingClientRect();
  const b = document.createElement('i'); b.className = 'fly';
  const x0 = fr.left + fr.width / 2 - 13, y0 = fr.top + fr.height / 2 - 13;
  const x1 = cr.left + cr.width / 2 - 13, y1 = cr.top + cr.height / 2 - 13;
  b.style.left = x0 + 'px'; b.style.top = y0 + 'px';
  document.body.append(b);
  b.animate([
    { transform: 'translate(0,0) scale(1) rotate(0)' },
    { transform: `translate(${(x1 - x0) * .5}px,${Math.min(y1 - y0, 0) - 120}px) scale(1.5) rotate(180deg)`, offset: .5 },
    { transform: `translate(${x1 - x0}px,${y1 - y0}px) scale(.4) rotate(360deg)` },
  ], { duration: 750, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => { b.remove(); done(); };
}

/* ---------- winkelmandje (UI: het verfblik) ---------- */
const bigCan = pct => `
<svg viewBox="0 0 120 130" id="bigCan" role="img" aria-label="Verfblik, ${Math.round(pct * 100)}% gevuld">
  <defs><clipPath id="bcClip"><rect x="14" y="36" width="92" height="86" rx="8"/></clipPath></defs>
  <path class="bc-handle" d="M18 40C18 2 102 2 102 40"/>
  <rect class="bc-body" x="14" y="36" width="92" height="86" rx="8"/>
  <g clip-path="url(#bcClip)"><g class="bc-paint" style="transform:translateY(${(1 - pct) * 86}px)">
    <path class="bc-wave" d="M-10 44q15-9 30 0t30 0 30 0 30 0 30 0 30 0 30 0v100H-10z"/>
  </g></g>
  <rect class="bc-rim" x="9" y="30" width="102" height="11" rx="5.500"/>
  <text class="bc-label" x="60" y="92" text-anchor="middle">${pct >= 1 ? 'GRATIS' : Math.round(pct * 100) + '%'}</text>
</svg>`;
function cartLinesHTML() {
  if (!cart.length) return `<div class="drawer-empty"><svg viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="4"><path d="M18 40C18 2 102 2 102 40"/><rect x="14" y="36" width="92" height="86" rx="8"/></svg>
    <p><b>Je verfblik is nog leeg.</b><br>Vul 'm met olie, beits of was en zie het peil stijgen.</p>
    <a class="btn btn-olive" href="#/winkel" data-close>Naar het assortiment ${ic('arrow')}</a></div>`;
  return cart.map((l, n) => {
    const i = lineInfo(l); if (!i) return '';
    return `<div class="line-item" data-line="${n}">
      <img src="${esc(i.p.img)}" alt="" width="72" height="72" ${imgErr}>
      <div><a href="#/p/${i.p.s}" data-close>${esc(i.p.n)}</a><small>${esc(i.label)} · ${eur(i.price)}</small>
        <div class="qty"><button type="button" data-q="-1" aria-label="Eén minder">${ic('minus')}</button>
        <input type="number" min="1" max="99" value="${l.q}" aria-label="Aantal ${esc(i.p.n)}">
        <button type="button" data-q="1" aria-label="Eén meer">${ic('plus')}</button></div></div>
      <div class="line-price">${eur(i.price * l.q)}<button class="rm" type="button" data-rm aria-label="Verwijder ${esc(i.p.n)}">${ic('trash')}</button></div>
    </div>`;
  }).join('');
}
function cartSummaryHTML(withButtons = true) {
  const t = totals();
  return `
    <form class="coupon" data-coupon><label class="sr" for="cp${withButtons ? 1 : 2}">Kortingscode</label>
      <input id="cp${withButtons ? 1 : 2}" placeholder="Kortingscode" value="${coupon ? esc(coupon.code) : ''}" autocomplete="off"><button>Toepassen</button></form>
    <div class="sum"><span>Subtotaal</span><b>${eur(t.sub)}</b></div>
    ${t.disc ? `<div class="sum"><span>Korting (${esc(coupon.code)}, demo)</span><b>− ${eur(t.disc)}</b></div>` : ''}
    <div class="sum"><span>Verzending (NL)</span><b>${t.sub === 0 ? '—' : t.ship ? eur(t.ship) : 'Gratis'}</b></div>
    <div class="sum total"><span>Totaal</span><span>${eur(t.total)}</span></div>
    ${withButtons ? `<a class="btn btn-primary" href="#/afrekenen" data-close ${cart.length ? '' : 'hidden'}>Afrekenen ${ic('arrow')}</a>
    <a class="btn btn-ghost" href="#/winkelmand" data-close>Bekijk winkelmand</a>` : ''}`;
}
function canMessage(t) {
  if (!t.sub) return `<p>Een vol blik = <b>gratis verzending</b> (vanaf ${eur(FREE_FROM)}).</p>`;
  const left = FREE_FROM - (t.sub - t.disc);
  return left > 0 ? `<p>Nog <b>${eur(left)}</b> en je blik zit vol: dan verzenden we <b>gratis</b>.</p>`
    : `<p class="free">Je blik zit tot de rand vol. Verzending is gratis!</p>`;
}
function renderCartUI() {
  const t = totals(), pct = Math.min((t.sub - t.disc) / FREE_FROM, 1) || 0;
  $('#cartCount').textContent = t.count;
  $('#cartBtn').classList.toggle('has-items', t.count > 0);
  $('#canFill').setAttribute('y', 44 - 28 * pct);
  const d = $('#drawer'), af = document.activeElement;
  const keep = d.contains(af) && af.closest('.line-item') ? [af.closest('.line-item').dataset.line, af.dataset.q] : null;
  d.innerHTML = `
    <div class="drawer-head"><h2 id="drawerTitle">Jouw verfblik</h2>
      <button class="icon-btn" type="button" data-close aria-label="Sluit winkelmandje">${ic('x')}</button></div>
    <div class="bigcan">${bigCan(pct)}<div>${canMessage(t)}</div></div>
    <div class="drawer-items">${cartLinesHTML()}</div>
    <div class="drawer-foot">${cartSummaryHTML()}</div>`;
  if (keep) (d.querySelector(`.line-item[data-line="${keep[0]}"] ${keep[1] ? `[data-q="${keep[1]}"]` : 'input'}`) || d.querySelector('[data-close]')).focus();
  const pageCart = $('#pageCart');
  if (pageCart) { pageCart.querySelector('[data-lines]').innerHTML = cartLinesHTML(); pageCart.querySelector('[data-sum]').innerHTML = cartSummaryHTML(false) + (cart.length ? `<a class="btn btn-primary" href="#/afrekenen">Verder naar afrekenen ${ic('arrow')}</a>` : ''); }
  const co = $('#checkoutSum'); if (co) co.innerHTML = checkoutSumHTML();
}
let lastFocus = null;
function openDrawer() {
  lastFocus = document.activeElement;
  const d = $('#drawer'), b = $('#drawerBackdrop');
  d.hidden = b.hidden = false;
  requestAnimationFrame(() => { d.classList.add('open'); b.classList.add('open'); });
  $('[data-close]', d).focus();
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  const d = $('#drawer'), b = $('#drawerBackdrop');
  if (d.hidden) return;
  d.classList.remove('open'); b.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { d.hidden = b.hidden = true; }, 500);
  lastFocus?.focus?.();
}
function applyCoupon(code) {
  code = code.trim().toUpperCase();
  if (!code) { coupon = null; saveCart(); return; }
  const ev = new CustomEvent('mp:coupon', { detail: { code, ok: false, pct: 0 }, cancelable: true });
  document.dispatchEvent(ev);
  if (ev.detail.ok) { coupon = { code, pct: ev.detail.pct }; saveCart(); }
  else toast('Onbekende code', 'Deze kortingscode kennen we niet.', 'x');
}
// gedelegeerde events voor mandje (lade + pagina)
document.addEventListener('click', e => {
  const line = e.target.closest('.line-item');
  if (line) {
    const n = +line.dataset.line;
    const qb = e.target.closest('[data-q]');
    if (qb) { cart[n].q = Math.max(1, Math.min(99, cart[n].q + +qb.dataset.q)); saveCart(); return; }
    if (e.target.closest('[data-rm]')) { line.classList.add('drip'); setTimeout(() => { cart.splice(n, 1); saveCart(); }, reduced ? 0 : 500); return; }
  }
  if (e.target.closest('#cartBtn')) return openDrawer();
  if (e.target.closest('#drawerBackdrop')) return closeDrawer();

  const kids = childrenOf(root.s);
  const chips = kids.length ? [['Alles', `#/c/${root.s}`, root.k], ...kids.map(k => [k.n, `#/c/${k.s}`, k.k])] : [];
  const crumbs = [['Assortiment', '#/winkel'], ...(parent ? [[parent.n, `#/c/${parent.s}`]] : []), [c.n]];
  return viewShop({ title: c.n, sub: `${c.k} producten in ${esc(c.n)}`, list: inCat(slug), crumbs, chips, active: `#/c/${slug}` });
}
function searchProducts(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return D.products.map(p => {
    const hay = (p.n + ' ' + mainCat(p) + ' ' + Object.values(p.a).join(' ')).toLowerCase();
    let score = 0;
    for (const t of terms) { if (!hay.includes(t)) return null; score += p.n.toLowerCase().includes(t) ? 2 : 1; }
    return { p, score: score + (p.t === 'bundle' ? -.5 : 0) };
  }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.p);
}

  }

      const dx = x - last.x, dy = y - last.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;

        const o = i * 10; sctx.moveTo(last.x + nx * o, last.y + ny * o); sctx.lineTo(x + nx * o, y + ny * o); sctx.stroke();
      }
    }
    last = { x, y }; compose();
    if (++moves % 25 === 0 && !done) {
      const d = sctx.getImageData(0, 0, W, H).data; let n = 0, tot = 0;
      for (let i = 3; i < d.length; i += 4 * 97) { tot++; if (d[i] > 40) n++; }

    }
  }
  plank.addEventListener('pointermove', e => { const r = plank.getBoundingClientRect(); stroke(e.clientX - r.left, e.clientY - r.top); });
  plank.addEventListener('pointerleave', () => last = null);
  img.addEventListener('load', compose);

  else { sctx.fillRect(0, 0, W / 2, H); compose(); }
}
