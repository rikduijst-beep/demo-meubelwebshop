chuur het houten oppervlak eerst zorgvuldig, zodat de wasbeits gelijkmatig kan intrekken.</li> <li><strong>Aanbrengen van de Beits:</strong> Gebruik een kwast om een egaal resultaat te bereiken.</li> <li><strong>Droogtijd:</strong> Laat de beits minstens 6 uur drogen bij een temperatuur van 20ºC.</li> <li><strong>Bewerk voor Glans:</strong> Na het drogen geeft u de wasbeits een diepe glans door het hout goed te borstelen of te boenen.</li> </ol> <p><strong>Extra Bescherming en Onderhoud: Gebruik Boenwas of Antiekwas</strong></p> <p>Om de kleur en uitstraling van uw houten meubels of vloer te behouden, kunt u na het aanbrengen van de Mahonie Wasbeits kiezen voor een afwerking met Blanke Boenwas of Antiekwas. Dit beschermt niet alleen het hout, maar versterkt ook de glans en zorgt ervoor dat het oppervlak langer mooi blijft.</p> <p><strong>Koop Nu Mahonie Wasbeits voor Authentiek, Duurzaam Resultaat</strong></p> <p>Kies voor Mahonie Wasbeits om hout een tijdloze, warme uitstraling te geven met een product dat milieuvriendelijk en gebruiksvriendelijk is. Perfect voor het opknappen van meubels en vloeren die karakter uitstralen!</p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40384,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20744,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20746,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Mahonie","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20737,"n":"Wasbeits Kersen (zuivere bijenwas)","s":"wasbeits-kersen-zuivere-bijenwas","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder oplosmiddelen</li> <li>Natuurzuiver bijenwas product in de kleur: Kersen</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<ul> <li><strong>Creëer een Authentieke, Kersenrode Houtlook met Onze Natuurlijke Wasbeits</strong></li> <li><strong>Duurzame Wasbeits Kersen: Voor een Natuurlijk Glanzend en Beschermd Meubel</strong></li> <li><strong>Kies voor Duurzaamheid en Kwaliteit met Wasbeits Kersen – Perfect voor Houtbewerking</strong></li> </ul> <p>De <strong>Wasbeits Kersen</strong> is dé ideale keuze voor het creëren van een warme, natuurlijke kersenhout uitstraling op diverse houtsoorten. Deze unieke kleurbeits is volledig oplosmiddelvrij en gemaakt van natuurzuivere bijenwas en transparante pigmenten, waardoor u kiest voor een duurzame en ecologisch verantwoorde optie. Onze Wasbeits Kersen biedt niet alleen een prachtige kleur en diepe glans, maar is ook gemakkelijk te gebruiken en geschikt voor diverse meubels en vloeren.</p> <p><strong>Waarom Kiezen voor Wasbeits Kersen?</strong></p> <ul> <li><strong>Natuurlijk en Duurzaam</strong>: Deze wasbeits bevat uitsluitend natuurlijke ingrediënten zoals bijenwas en plantaardige pigmenten. Duurzaamheid en een authentieke uitstraling staan centraal.</li> <li><strong>Gemakkelijk in Gebruik</strong>: Breng de wasbeits aan met een kwast en geniet van een egaal, professioneel resultaat. Na droging van circa 6 uur kan het oppervlak worden opgepoetst voor een natuurlijke glans.</li> <li><strong>Geen Laklaag Nodig</strong>: De Wasbeits Kersen biedt een duurzame afwerking zonder extra laklaag. Voor extra bescherming kunt u afwerken met onze Blanke Boenwas of Antiekwas.</li> </ul> <p><strong>Stap-voor-Stap Handleiding voor de Perfecte Afwerking</strong></p> <ol> <li><strong>Voorbereiding</strong>: Schuur het meubel of oppervlak goed voor een optimale hechting.</li> <li><strong>Aanbrengen</strong>: Gebruik een kwast om de Wasbeits Kersen egaal aan te brengen.</li> <li><strong>Drogen en Polijsten</strong>: Laat de wasbeits minimaal 6 uur drogen bij een temperatuur van 20°C. Boen vervolgens het oppervlak grondig uit voor een natuurlijke, warme glans.</li> </ol> <p><strong>Optimale Bescherming</strong> Voor een extra langdurige bescherming kunt u de beits afwerken met Blanke Boenwas of Antiekwas. Dit zorgt niet alleen voor een hogere duurzaamheid, maar geeft het meubel ook een verfijnde, luxe uitstraling.</p> <p><strong>Kies voor Wasbeits Kersen – Perfect voor een Stijlvol en Authentiek Houtmeubel</strong> Maak uw meubels of vloeren weer levendig met de natuurlijke kersen kleur die deze wasbeits biedt. Bestel vandaag nog en ervaar zelf de voordelen van een hoogwaardige, milieuvriendelijke houtafwerking die jarenlang mooi blijft.</p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40385,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20739,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20741,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Kersen","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20732,"n":"Wasbeits Castle Bruin (zuivere bijenwas)","s":"wasbeits-castle-bruin-zuivere-bijenwas","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder ammoniak</li> <li>Natuurzuiver bijenwas product in de kleur: Castle Bruin</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<h3>Wasbeits Castle Bruin: Dé Natuurlijke Houtbeits voor een Authentieke Uitstraling</h3> <p>Ontdek de <strong>Wasbeits Castle Bruin</strong> – de perfecte oplossing voor iedereen die hout wil voorzien van een warme, natuurlijke uitstraling zonder schadelijke oplosmiddelen. Deze duurzame kleurbeits is gemaakt van pure bijenwas en natuurlijke pigmenten, en is geschikt voor diverse houtsoorten. Of het nu gaat om meubels, vloeren of decoratieve houten oppervlakken, Wasbeits Castle Bruin zorgt voor een stijlvolle, rustieke uitstraling.</p> <h4>Voordelen van Wasbeits Castle Bruin</h4> <ul> <li><strong>Oplosmiddelvrij en duurzaam</strong>: Gemaakt met 100% natuurlijke ingrediënten, veilig voor mens en milieu.</li> <li><strong>Eenvoudig aan te brengen</strong>: Met een borstel of kwast, en eenvoudig uit te boenen voor een diepe, glanzende afwerking.</li> <li><strong>Langdurige bescherming</strong>: Creëer een duurzame uitstraling zonder lak; voor extra bescherming gebruikt u eenvoudig onze <strong>Boenwas</strong> of <strong>Antiekwas</strong> in kleur of blank.</li> </ul> <h4>Hoe Brengt U Wasbeits Castle Bruin Aan?</h4> <ol> <li><strong>Voorbereiden</strong>: Schuur het houten oppervlak goed om een optimale hechting te garanderen.</li> <li><strong>Aanbrengen</strong>: Breng de Wasbeits Castle Bruin egaal aan met een kwast en laat 6 uur drogen bij een temperatuur van 20ºC.</li> <li><strong>Afwerken</strong>: Boen het oppervlak zorgvuldig uit voor een warme, natuurlijke glans. Voor een extra beschermlaag kunt u de afwerking doen met Blanke Boenwas.</li> </ol> <h3>Waarom Kiezen voor Wasbeits Castle Bruin?</h3> <p>Wasbeits Castle Bruin combineert kwaliteit met eenvoud. Deze beits brengt het karakter van hout naar voren zonder dat een laklaag nodig is. Dankzij de natuurlijke bestanddelen ziet uw hout er niet alleen goed uit, maar blijft het ook goed onderhouden en beschermd.</p> <p>Transformeer uw houten meubels of vloeren met de natuurlijke pracht van <strong>Wasbeits Castle Bruin</strong> – voor een stijlvol en duurzaam interieur.</p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40386,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20734,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20736,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Castle Bruin","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20727,"n":"Wasbeits Licht Eiken (zuivere bijenwas)","s":"wasbeits-licht-eiken-zuivere-bijenwas","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder oplosmiddelen</li> <li>Natuurzuiver bijenwas product in de kleur: Licht Eiken</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<h3><strong>Natuurlijk stralende houtafwerking met Wasbeits Licht Eiken – Duurzaam, authentiek en makkelijk aan te brengen</strong></h3> <p><strong>Zoekt u een milieuvriendelijke houtbeits die een warme, natuurlijke uitstraling geeft aan uw meubels en vloeren?</strong> Onze Wasbeits in de kleur Licht Eiken is dé perfecte keuze. Deze decoratieve kleurbeits is geheel oplosmiddelvrij en bevat natuurzuivere bijenwas en hoogwaardige, transparante pigmenten. Ideaal voor diverse houtsoorten, en volledig volgens een duurzaam en innovatief recept vervaardigd.</p> <p>Met deze wasbeits creëert u eenvoudig een authentieke houtlook, terwijl de natuurlijke uitstraling behouden blijft. Omdat de wasbeits diep in het hout trekt en het hout verrijkt, is het niet mogelijk om er een laklaag over aan te brengen. <strong>Voor een schitterende, subtiele glans</strong> borstel of boen de beits goed op na het drogen.</p> <h4><strong>Belangrijke voordelen van Wasbeits Licht Eiken:</strong></h4> <ul> <li><strong>Natuurlijke uitstraling</strong>: Geeft hout een warme, levendige tint.</li> <li><strong>Duurzaam en oplosmiddelvrij</strong>: Gemaakt met bijenwas en natuurlijke pigmenten.</li> <li><strong>Eenvoudig aan te brengen</strong>: Perfect voor doe-het-zelf projecten en professionele toepassingen.</li> </ul> <h3><strong>Gebruiksaanwijzing: zo haalt u het beste uit Wasbeits Licht Eiken</strong></h3> <ol> <li><strong>Schuren</strong>: Begin met het schuren van het meubel om de oppervlakte glad en schoon te maken.</li> <li><strong>Aanbrengen met kwast</strong>: Breng Wasbeits Licht Eiken aan met een kwast en verdeel de beits egaal.</li> <li><strong>Drogen</strong>: Laat de beits minimaal 6 uur drogen bij een omgevingstemperatuur van 20°C.</li> <li><strong>Polijsten voor glans</strong>: Voor een extra mooie glans, boen of borstel de beits na het drogen zorgvuldig op.</li> </ol> <p><strong>Tip</strong>: Wilt u extra bescherming of wilt u het onderhoud van uw houten meubel vereenvoudigen? Werk dan af met een laagje Boenwas of Antiekwas, in kleur of blank. Hiermee zorgt u voor een langdurig beschermde en prachtig glanzende afwerking.</p> <h3><strong>Ook beschikbaar in Wasbeits Castle Bruin – Klassiek en intens</strong></h3> <p>Voor een dieper en klassiek accent op uw meubels kunt u kiezen voor <strong>Wasbeits Castle Bruin</strong>. Deze variant volgt dezelfde gebruiksaanwijzing als de Licht Eiken, met een droogtijd van 6 uur bij 20°C en afwerking met Blanke Boenwas. Zo geeft u uw meubels een rijke, warme uitstraling.</p> <h3><strong>Waarom kiezen voor onze Wasbeitsen?</strong></h3> <p>Onze Wasbeitsen zijn niet alleen eenvoudig in gebruik, maar ook ideaal voor duurzame houtafwerkingen zonder schadelijke stoffen. Ze geven uw meubels een unieke, persoonlijke uitstraling, waardoor elk stuk hout karakter krijgt.</p> <p><strong>Bestel uw Wasbeits nu en ontdek zelf de natuurlijke schoonheid van uw meubels en vloeren!</strong></p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40387,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20729,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20731,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Blank Eiken","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20634,"n":"Wasbeits Grenen (zuivere bijenwas)","s":"wasbeits-zuivere-bijenwas-grenen","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder oplosmiddelen</li> <li>Natuurzuiver bijenwas product in de kleur: Grenen</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<p><strong>Grenen Wasbeits met Bijenwas: Natuurlijke Kleur en Bescherming voor Hout</strong></p> <h3>Ontdek de Authentieke Kracht van Onze Grenen Wasbeits</h3> <p>Geef je hout een duurzame en natuurlijke uitstraling met onze <em>Grenen Wasbeits op waterbasis</em>, een innovatieve beits verrijkt met natuurzuivere bijenwas en transparante pigmenten. Door het unieke, milieuvriendelijke recept – zonder ammoniak en vol natuurlijke ingrediënten – geniet je van een diep, levendig kleurresultaat. Onze beits is ideaal voor vrijwel iedere houtsoort en versterkt de natuurlijke houtstructuur, zonder dat je een laklaag hoeft aan te brengen. Voor extra bescherming kun je afwerken met Boenwas of Antiekwas.</p> <h4>De Voordelen van Wasbeits Grenen:</h4> <ul> <li><strong>Milieuvriendelijk</strong>: Geen ammoniak, wél duurzame, natuurlijke ingrediënten</li> <li><strong>Natuurlijke uitstraling</strong>: Diepe kleur en accentuering van de houtnerven</li> <li><strong>Veelzijdig</strong>: Geschikt voor bijna alle houtsoorten</li> </ul> <h3>Hoe Breng je Wasbeits Grenen Optimaal aan?</h3> <p>Volg onze eenvoudige gebruiksinstructies voor het beste resultaat:</p> <ol> <li><strong>Voorbereiding</strong>: Schuur het oppervlak goed op voor een optimale hechting.</li> <li><strong>Aanbrengen</strong>: Breng Wasbeits Grenen gelijkmatig aan met een kwast.</li> <li><strong>Drogen</strong>: Laat de beits minstens 6 uur drogen bij kamertemperatuur (20°C).</li> <li><strong>Nabewerking</strong>: Boen grondig uit voor een diepe glans en werk desgewenst af met Blanke Boenwas voor extra bescherming.</li> </ol> <h3>Beschikbaar in Meerdere Kleuren</h3> <p>Naast Grenen bieden we ook de Wasbeits in de kleuren <em>Licht Eiken</em> en <em>Castle Bruin</em>. Beide varianten hebben dezelfde duurzame eigenschappen en zijn eenvoudig aan te brengen:</p> <ul> <li><strong>Wasbeits Licht Eiken</strong>: Breng natuurlijke elegantie aan op eikenhouten meubels en oppervlakken.</li> <li><strong>Wasbeits Castle Bruin</strong>: Voor een warme, klassieke houtkleur met een luxe uitstraling.</li> </ul> <h3>Waarom Kiezen voor Onze Natuurlijke Wasbeits?</h3> <p>Onze wasbeits is perfect voor iedereen die een milieubewuste keuze wil maken zonder in te boeten op kwaliteit of stijl. De formule op basis van bijenwas en transparante pigmenten zorgt voor een langdurige bescherming, natuurlijke schoonheid en een prachtig, dieptevol eindresultaat.</p> <p><strong>Kies voor Wasbeits Grenen en creëer een duurzame, stijlvolle afwerking voor jouw houten meubels!</strong></p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40389,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20636,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20638,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Oud Grenen","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20416,"n":"Terpentine","s":"terpentine-aromaatvrij-reukloos","t":"variable","c":["onderhoudsmiddelen-en-reparatie","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Voor verdunnen van synthetische Lak, Olie of Verf</li> <li>Voor het ontvetten van metaal</li> <li>Voor het schoonmaken van kwasten en rollers en andere verfgereedschappen</li> </ul>","d":"<p>Veba Aromaatvrije Terpentine is aromaatvrij en reukloos. Hierdoor is Aromaatvrije Terpentine een stuk vriendelijker voor mens en milieu. Veba Aromaatvrije Terpentine is geschikt als verdunningsmiddel voor synthetische lakken, olie en verven. Ook geschikt als ontvetter voor metalen.</p>","p":345,"r":345,"sale":false,"stock":false,"v":[{"id":20417,"l":"500 ml","p":345,"r":345,"s":false},{"id":20418,"l":"1 liter","p":675,"r":675,"s":true}],"a":{"Inhoud":"500 ml, 1 liter","Geschikt voor":"Meubelolie, Synthetische Lak, Synthetische Verf, Vloerolie","Aanbrengen":"Dweil, Mop, Spons of doek"},"opt":false},{"id":20297,"n":"Invisible Oil Transparant (watergedragen)","s":"invisible-oil","t":"variable","c":["invisible-oil-waterbaseerd","hardwax-olie-f-serie-meubelie-vloerolie"],"img":"","imgs":[],"sd":"<ul> <li>Geeft een blanke &#8220;onzichtbare&#8221; afwerking.</li> <li>Beschermt tegen water, wijn, koffie en andere vervuiling</li> <li>Uitermate geschikt voor meubels en vloeren die zijn behandeld met waterbeits</li> <li>Watergedragen</li> <li>Verbruik 10-12 m2 per liter</li> <li>Droogtijd 4-5 uur per laag (afhankelijk van de omstandigheden)</li> <li>Invisible Oil geeft een natuurlijke afwerking</li> <li>Kan worden aangebracht met kwast of spuitpistool</li> </ul>","d":"<h3>Onzichtbare Bescherming met Demo Meubelwebshop Invisible Oil</h3> <p><strong>Blanke, Onzichtbare Laag voor Optimale Houtbescherming</strong></p> <p>Demo Meubelwebshop Invisible Oil biedt een blanke, &#8220;onzichtbare&#8221; beschermlaag die het natuurlijke uiterlijk van uw hout behoudt. Zonder het hout te veranderen, beschermt deze olie effectief tegen vlekken van water, wijn, koffie en andere vervuilingen. Ideaal voor wie de pure uitstraling van hout wil behouden, met de zekerheid van langdurige bescherming.</p> <p><strong>Geschikt voor Diverse Houtsoorten</strong></p> <p>Invisible Oil is een watergedragen product dat geschikt is voor gebruik op verschillende houtsoorten, maar alleen binnenshuis. Dankzij de gebruiksvriendelijke formule kan het eenvoudig worden aangebracht met een kwast of spuitpistool. Deze olie is de perfecte afwerking voor meubels en vloeren die eerder behandeld zijn met waterbeits.</p> <p><strong>Aanbrengadvies voor Langdurige Bescherming</strong></p> <p>Voor het beste resultaat raden wij aan om twee lagen Invisible Oil aan te brengen. Om de duurzaamheid te verhogen, kunt u het hout eerst behandelen met één laag <a href=\"#\" target=\"_blank\" rel=\"noopener\">Sanding Sealer</a>. Dit zorgt voor een betere hechting en biedt extra bescherming.</p> <p>Kies voor Demo Meubelwebshop Invisible Oil en geef uw meubels en vloeren een onzichtbare, maar krachtige beschermlaag!</p>","p":1795,"r":1795,"sale":false,"stock":true,"v":[{"id":40391,"l":"250 ml","p":1795,"r":1795,"s":true},{"id":20298,"l":"1 liter","p":3495,"r":3495,"s":true},{"id":20300,"l":"5 liter","p":15950,"r":15950,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 1 liter, 5 liter","Geschikt voor":"Houten meubelen en vloeren","Aanbrengen":"Kwast of lakroller","Droogtijden":"4 tot 5 uur per laag","Verbruik":"10 tot 12 m² / liter","Kleur":"Transparant"},"opt":false},{"id":20291,"n":"Sanding Sealer","s":"sanding-sealer","t":"variable","c":["lakken","watergedragen-lak","overige-lakken"],"img":"","imgs":[],"sd":"<ul> <li>Grondlak op waterbasis</li> <li>Eenvoudig te verdunnen met (warm) water</li> <li>Transparant en sneldrogend</li> <li>Vult kleine onregelmatigheden in het houten oppervlak op</li> <li>Geschikt voor alle houten vloeren en meubelen</li> <li>Speciaal geschikt voor gebruik over <a href=\"#\" target=\"_blank\" rel=\"noopener\">waterbeits</a></li> <li>1 laag is voldoende</li> <li>Verbruik: 10 tot 12 m² per liter</li> </ul>","d":"<h2>Transparante en Sneldrogende Grondlak: Sanding Sealer</h2> <p><strong>Sanding Sealer: De Perfecte Basis voor een Glad Houten Oppervlak</strong></p> <p>Sanding Sealer is een hoogwaardige, transparante en sneldrogende grondlak, speciaal ontworpen om houten oppervlakken eenvoudig glad te schuren. Deze grondlak is ideaal voor het beschermen van oppervlakken die zijn gekleurd met waterbeits of kleurbeits, zonder de kleurlaag te beschadigen. Met Sanding Sealer vult u kleine onregelmatigheden op en creëert u een perfect glad oppervlak, klaar voor verdere afwerking met bijvoorbeeld Invisible Oil of PU-lak Topcoat.</p> <h3>Waarom Kiezen voor Sanding Sealer?</h3> <p><strong>1. Beschermt de Kleurlaag</strong><br> Sanding Sealer biedt uitstekende bescherming voor oppervlakken die zijn behandeld met waterbeits. Het stelt u in staat om het hout glad te schuren zonder dat de kleurlaag wordt aangetast. Hierdoor blijft de kleur van uw project perfect behouden, zelfs na het schuren.</p> <p><strong>2. Ideaal als Impregneer- en Beschermlaag</strong><br> Deze grondlak werkt niet alleen als tussenlaag, maar ook als een effectieve impregneer- en beschermlaag over waterbeits. Het beschermt het houtoppervlak tegen beschadiging tijdens het schuren, wat resulteert in een vlekkeloos eindresultaat.</p> <p><strong>3. Sneldrogend en Makkelijk te Schuren</strong><br> Sanding Sealer droogt binnen slechts 1 uur, waardoor u snel door kunt werken. Na het drogen is het oppervlak eenvoudig te schuren, wat zorgt voor een perfect gladde afwerking die klaar is voor de eindlaag.</p> <h3>Voordelen van Sanding Sealer</h3> <ul> <li><strong>Transparante Formule</strong>: De grondlak is volledig transparant, waardoor de natuurlijke houtkleur zichtbaar blijft.</li> <li><strong>Watergedragen Formule</strong>: Omdat Sanding Sealer op waterbasis is, geeft het geen schadelijke dampen of geuren af. Dit maakt het veiliger in gebruik en beter voor het milieu.</li> <li><strong>Geschikt voor Alle Houtsoorten</strong>: Sanding Sealer kan op diverse houtsoorten worden toegepast, waardoor het een veelzijdige keuze is voor verschillende projecten.</li> <li><strong>Eenvoudig aan te brengen</strong>: De grondlak kan zowel met een kwast als een spuitpistool worden aangebracht. Verdunning is mogelijk met (warm) water, waardoor het gebruiksgemak verder wordt vergroot.</li> <li><strong>Eén enkele laag is voldoende</strong>: Met slechts één laag bereikt u al een glad en egaal oppervlak, wat tijd bespaart tijdens uw project.</li> </ul> <h3>Hoe Sanding Sealer te Gebruiken</h3> <ol> <li><strong>Oppervlak Voorbereiden</strong>: Zorg dat het hout schoon, droog en vrij van stof is voordat u de grondlak aanbrengt.</li> <li><strong>Aanbrengen</strong>: Breng een dunne laag Sanding Sealer aan met een kwast of spuitpistool. U kunt de lak eventueel verdunnen met warm water.</li> <li><strong>Drogen</strong>: Laat het oppervlak ongeveer 1 uur drogen.</li> <li><strong>Schuren</strong>: Schuur het oppervlak glad zonder de kleurlaag te beschadigen.</li> <li><strong>Afwerken</strong>: Het gladde oppervlak is nu klaar voor een eindafwerking met</li> <li><a href=\"#\" target=\"_blank\" rel=\"noopener\">Invisible Oil</a> of <a href=\"#\" target=\"_blank\" rel=\"noopener\">PU-lak Topcoat</a>.</li> </ol> <p>Kies voor Sanding Sealer voor een glad, perfect voorbereid houten oppervlak dat eenvoudig te schuren is, zonder verlies van kleur of kwaliteit!</p>","p":1595,"r":1595,"sale":false,"stock":true,"v":[{"id":20293,"l":"250 ml","p":1595,"r":1595,"s":true},{"id":20294,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20295,"l":"5 liter","p":12995,"r":12995,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 1 liter, 5 liter","Geschikt voor":"Houten meubelen en vloeren","Aanbrengen":"Roller of kwast","Droogtijden":"Overschilderbaar na ca. 1 uur","Verbruik":"10 tot 12 m² / liter","Kleuren":"Blank"},"opt":false},{"id":19929,"n":"Budget Verfroller Beugel","s":"budget-verfroller-beugel","t":"variable","c":["gereedschap","kwasten-en-rollers"],"img":"","imgs":[],"sd":"<ul> <li>Meerdere malen te gebruiken</li> <li>Prettig in gebruik</li> <li>Ligt stevig in de hand</li> <li>Licht van gewicht</li> </ul>","d":"<p>Deze budget beugel is prettig in gebruik én goedkoop! Hij doet precies waarvoor hij bestemd is en dat voor een heel zacht prijsje. De beugel is meerdere malen te gebruiken.<br> Let op! Beugel is nog zonder roller.</p>","p":145,"r":145,"sale":false,"stock":false,"v":[{"id":19930,"l":"5 cm","p":145,"r":145,"s":false},{"id":19931,"l":"10 cm","p":165,"r":165,"s":false}],"a":{"Inhoud":"10 cm, 5 cm"},"opt":false},{"id":19810,"n":"Waterbeits Zwart QN1110","s":"waterbeits-zwart-qn1110","t":"variable","c":["waterbeits-quality-naturals-beits-waterbasis","hout-kleuren-met-oneindig-veel-kleuren"],"img":"","imgs":[],"sd":"<ul> <li>Waterbeits in de kleur Zwart QN1110</li> <li>Ook wel bekend als Waterbeits Quality Naturals Zwart</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> </ul>","d":"<p><strong>Waterbeits Zwart QN1110 – Hoogwaardige Kleurbeits voor Hout</strong></p> <p>Op zoek naar een kwalitatieve, watergedragen beits voor hout? <strong>Waterbeits Zwart QN1110</strong> is de ideale keuze! Deze hoogwaardige beits is speciaal ontwikkeld voor het transparant inkleuren van houten meubelen, vloeren en andere houten oppervlakken. Dankzij de unieke samenstelling behoudt het hout zijn natuurlijke uitstraling en is de beits beschikbaar in vrijwel elke kleur.</p> <h3><strong>Voordelen van Waterbeits Zwart QN1110</strong></h3> <p>Watergedragen en milieuvriendelijk<br> Transparante kleuring zonder de houtnerf te verbergen<br> Geschikt voor alle houtsoorten<br> Eenvoudige verwerking met kwast of spuitpistool<br> Snelle droogtijd: 1-2 uur</p> <h2><strong>Gebruiksaanwijzing</strong></h2> <h3><strong>Aanbrengen met een kwast</strong></h3> <ol> <li>Schuur het oppervlak met schuurpapier (korrel 120 &#8211; 180) en verwijder stof en vuil.</li> <li>Breng de beits gelijkmatig aan, dwars op de houtnerf.</li> <li>Laat de beits 1 minuut intrekken en egaliseer in de richting van de nerf.</li> <li>Laat de beits 1-2 uur drogen.</li> <li>Werk af met een beschermende laag, zoals <strong>Hardwaxolie, Waterlak of PU-Lak</strong>.</li> </ol> <h3><strong>Aanbrengen met een spuitpistool</strong></h3> <ol> <li>Schuur het houtoppervlak (korrel 120 &#8211; 180) en maak het stofvrij.</li> <li>Gebruik een pneumatisch spuitpistool met nozzle 1.3 – 1.5 mm en een werkdruk van 1.5 – 2.0 bar.</li> <li>Laat de beits 1-2 uur drogen.</li> <li>Breng een afwerkingslaag aan voor extra bescherming tegen vocht en vuil.</li> </ol>  <h3><strong>Geschikt voor Alle Houtsoorten</strong></h3> <p><strong>Waterbeits Zwart QN1110</strong> is toepasbaar op diverse houtsoorten. Voor een optimale bescherming tegen water en vuil wordt een afwerking met <strong>Hardwaxolie of Lak</strong> aanbevolen. Bij bijzondere houtsoorten is het raadzaam om vooraf een test uit te voeren.</p> <p>Kies voor de beste waterbeits en geef jouw houtwerk een professionele en duurzame uitstraling!</p>","p":1495,"r":1495,"sale":false,"stock":true,"v":[{"id":40344,"l":"250 ml","p":1495,"r":1495,"s":true},{"id":19812,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":28478,"l":"5 liter","p":13495,"r":13495,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Zwart, Zwart Extra","Aanbrengen":"Roller, kwast, pluisvrije doek of spuit","Verbruik":"12 – 15 m² / liter"},"opt":false},{"id":19806,"n":"Waterbeits Wit QN1100","s":"waterbeits-wit-qn1100","t":"variable","c":["waterbeits-quality-naturals-beits-waterbasis","hout-kleuren-met-oneindig-veel-kleuren"],"img":"","imgs":[],"sd":"<ul> <li>Waterbeits in de kleur Wit QN1100</li> <li>Ook wel bekend als Waterbeits Quality Naturals Wit</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> </ul>","d":"<p><strong>Waterbeits Wit QN1100 – Hoogwaardige Transparante Houtbeits</strong></p> <p>Op zoek naar een duurzame en hoogwaardige waterbeits voor hout? De <strong>Waterbeits Wit QN1100</strong> is een topkwaliteit, watergedragen beits die speciaal is ontwikkeld voor het transparant inkleuren van <strong>houten meubelen, vloeren en andere houtoppervlakken</strong>. Deze beits behoudt de natuurlijke uitstraling van het hout en is verkrijgbaar in vrijwel <strong>elke gewenste kleur</strong>.</p> <h3><strong>Waarom kiezen voor Waterbeits Wit QN1100?</strong></h3> <p>Geschikt voor <strong>alle houtsoorten</strong><br> <strong>Behoudt</strong> de natuurlijke uitstraling van hout<br> Verkrijgbaar in <strong>veel kleuren</strong><br> <strong>Milieuvriendelijk</strong> en op waterbasis<br> Te combineren met <strong>Hardwaxolie, Waterlak of PU-Lak</strong> voor optimale bescherming tegen water en vuil</p> <p><strong>Let op:</strong> Bij speciale houtsoorten wordt aangeraden om de waterbeits eerst uit te testen.</p> <h3><strong>Verwerkingsadvies Waterbeits Wit QN1100</strong></h3> <h4><strong>Aanbrengen met een kwast</strong></h4> <ol> <li><strong>Schuren:</strong> Gebruik korrel <strong>120 &#8211; 180</strong> en verwijder stof.</li> <li><strong>Aanbrengen:</strong> Breng de beits aan <strong>dwars op de nerf</strong> met een kwast.</li> <li><strong>Egaliseren:</strong> Laat <strong>1 minuut</strong> intrekken en strijk uit in de richting van de nerf.</li> <li><strong>Drogen:</strong> Laat <strong>1-2 uur</strong> drogen.</li> <li><strong>Afwerking:</strong> Breng een beschermlaag aan met <strong>Hardwaxolie, Waterlak of PU-Lak</strong>.</li> </ol> <h4><strong>Aanbrengen met een spuitpistool</strong></h4> <ol> <li><strong>Schuren:</strong> Gebruik korrel <strong>120 &#8211; 180</strong> en verwijder stof.</li> <li><strong>Spuiten:</strong> Gebruik een <strong>pneumatisch spuitpistool</strong> met <strong>nozzle 1.3 – 1.5 mm</strong> en een werkdruk van <strong>1.5 – 2.0 bar</strong>.</li> <li><strong>Drogen:</strong> Laat <strong>1-2 uur</strong> drogen.</li> <li><strong>Afwerking:</strong> Breng een beschermlaag aan met <strong>Hardwaxolie, Waterlak of PU-Lak</strong>.</li> </ol> <h3><strong>Ook beschikbaar: Waterbeits Zwart</strong></h3> <p>Naast Waterbeits Wit biedt ons assortiment ook <strong>Waterbeits Zwart</strong>, geschikt voor <strong>alle houtsoorten</strong>. Net als de witte variant zorgt deze beits voor een diepe, natuurlijke uitstraling en dient deze te worden afgewerkt met een beschermlaag zoals <strong>Hardwaxolie of Lak</strong>.</p> <p>Voor optimale resultaten test je de beits altijd eerst op een klein oppervlak.</p> <h4><strong>Bestel Waterbeits Wit QN1100 vandaag nog!</strong></h4> <p>Wil je jouw houtproject een prachtige, natuurlijke uitstraling geven? <strong>Bestel nu</strong> Waterbeits Wit QN1100 en profiteer van hoogwaardige bescherming en een perfecte afwerking!</p>","p":1495,"r":1495,"sale":false,"stock":true,"v":[{"id":40345,"l":"250 ml","p":1495,"r":1495,"s":true},{"id":19808,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":28480,"l":"5 liter","p":13495,"r":13495,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Wit","Aanbrengen":"Roller, kwast, pluisvrije doek of spuit","Verbruik":"12 – 15 m² / liter"},"opt":false},{"id":19801,"n":"Waterbeits Koloniaal QN1090","s":"waterbeits-koloniaal-qn1090","t":"variable","c":["waterbeits-quality-naturals-beits-waterbasis","hout-kleuren-met-oneindig-veel-kleuren"],"img":"","imgs":[],"sd":"<ul> <li>Waterbeits in de kleur Koloniaal QN1090</li> <li>Ook wel bekend als Waterbeits Quality Naturals Koloniaal</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> </ul>","d":"<p>De Waterbeits Koloniaal QN1090 is een reeks hoogwaardige, water gebaseerde beitsen. Ze zijn speciaal ontwikkeld voor het transparant inkleuren van houten meubelen, vloeren etc.</p> <p>Het behoudt de natuurlijke uitstraling van het hout en is verkrijgbaar in bijna elke kleur.</p> <p>De Waterbeits Koloniaal is geschikt voor alle houtsoorten. Voor de bestendigheid tegen water en vuilverontreiniging moet het afgewerkt worden met Hardwax olie of Lak.</p> <p>Bij speciale houtsoorten is het wel aanbevolen om de waterbeits eerst uit te testen.</p>","p":1495,"r":1495,"sale":false,"stock":true,"v":[{"id":40346,"l":"250 ml","p":1495,"r":1495,"s":true},{"id":19803,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":28481,"l":"5 liter","p":13495,"r":13495,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Koloniaal","Aanbrengen":"Roller alse,"stock":true,"v":[{"id":40356,"l":"250 ml","p":1495,"r":1495,"s":true},{"id":19750,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":28489,"l":"5 liter","p":13495,"r":13495,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Naturel, Blank Eiken","Aanbrengen":"Roller, kwast, pluisvrije doek of spuit","Verbruik":"12 – 15 m² / liter"},"opt":false},{"id":19507,"n":"Go!Paint Verfblik Opener","s":"gopaint-verfblik-opener","t":"simple","c":["gereedschap","diversen"],"img":"","imgs":[],"sd":"<ul> <li>Voor het openen van alle soorten verfblikken</li> <li>Veilige en ergonomische handgreep</li> <li>Zeer stevige kwaliteit</li> </ul>","d":"<p>De multi blikopener is geschikt voor het openen van verfblikdeksels, machinaal gesloten sluitringen en lipdeksels. Ook voor het ontluchten tijdens het schenken uit een vloeistofblikverpakking, kunt u met deze tool eenvoudig een gat in de verpakking prikken.</p> <p><strong>Verfblikdeksels</strong><br> Met de staart van de opener kunnen alle standaard verfblikken geopend worden.</p> <p><strong>Sluitringen<br> </strong>Met behulp van de bek van de opener kunnen machinaal gesloten sluitringen eenvoudig geopend worden.</p> <ul> <li>Plaats de punt van de bek stevig in het gat van de sluitring.</li> <li>Trek de lip open door de opener van het blik weg te draaien. Gebruik de kop van de opener als hefboom.</li> <li>Draai de opener om en trek de sluitring volledig open met de bek,</li> <li>Duw het oor tussen deksel en blikrand en open de deksel.</li> </ul> <p><strong>Ontluchten</strong><br> Tevens kan met de bek gemakkelijk een gat in de vloeistofblikverpakking geprikt worden om tijdens het schenken het blik te ontluchten waardoor de inhoud gelijkmatig uitgeschonken kan worden.</p> <p><strong>Sluitringen</strong><br> De multi opener opent zonder moeite gekraalde lipdeksels en vlakke lipdeksels. Voor het openen van de gekraalde lipdeksels dient de kop van de opener gebruikt te worden. Voor het openen van de vlakke lipdeksels plaatst u de staart van de opener in het gat van de lip waarna de lip omhoog gebogen kan worden.</p>","p":400,"r":400,"sale":false,"stock":true,"v":[],"a":{"Geschikt voor":"Alle houtsoorten, Alle soorten plamuur en vloeibaar hout"},"opt":false},{"id":19370,"n":"Set Japanse Plamuurmessen (4 stuks)","s":"set-japanse-plamuurmessen","t":"simple","c":["gereedschap","diversen"],"img":"","imgs":[],"sd":"<ul> <li>Set van 4 stuks Japanse plamuurmessen</li> <li>afmetingen 60 mm, 80 mm, 100 mm en 120 mm</li> <li>Handig bij het afwerken van onder andere gebogen oppervlakken</li> <li>Voor het strak afwerken van plamuurlagen of vloeibaar hout</li> </ul>","d":"<p>Met deze set Japanse plamuur spachtels of plamuurmessen grijpt u nooit meer mis. De set bestaat uit vier verschillenden maten Japanse plamuurmessen waardoor er altijd een passende maat bij zit. De Japanse plamuurmessen hebben flexibele bladen waardoor ze ook gemakkelijk te gebruiken zijn op gebogen oppervlakken. De Japanse plamuurmessen bestaan uit 0,3 mm dik, gehard en gepolijst, roestvrij verenbandstaal en zijn bestand tegen oplosmiddelen.</p>","p":345,"r":345,"sale":false,"stock":true,"v":[],"a":{"Geschikt voor":"Alle houtsoorten, Alle soorten plamuur en vloeibaar hout"},"opt":false},{"id":19365,"n":"Huishoudspons","s":"huishoudspons-multy","t":"simple","c":["gereedschap","diversen","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Schoon</li> <li>Sterk</li> <li>Superhandig bij het snel aanbrengen van Waterbeits, Kleurbeits of Verouderingsbeits</li> </ul>","d":"<p>Deze huishoudspons kunt u gebruiken voor het schoonmaken van uw meubel of vloer. Daarnaast is de spons perfect te gebruiken voor het aanbrengen van Waterbeits, Kleurbeits of Verouderingsbeits. Hiermee bespaart u beits en brengt u deze zeer snel aan.</p> <p>Deze huishoudspons kan natuurlijk ook worden gebruikt voor allerhande huishoudelijk werk waarbij een spons nodig is.</p>","p":285,"r":285,"sale":false,"stock":false,"v":[],"a":{},"opt":false},{"id": erbeits eerst uit te testen. Houtsoorten zoals beukenhout hebben namelijk speciale behandeling nodig om te voorkomen dat er vlekken ontstaan. Ook blauwzwam of spint vragen speciale gemaakte waterbeits </p>","p":1995,"r":2895,"sale":true,"stock":true,"v":[{"id":1875,"l":"1 liter","p":1995,"r":2895,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"MBW 947","Aanbrengen":"Spons of doek","Verbruik":"12 – 15 m² / liter"},"opt":false},{"id":1860,"n":"Onderhoudsolie Naturel Mat","s":"onderhoudsolie-onderhoudswasolie-mat","t":"variable","c":["onderhoudsmiddelen-en-reparatie","onderhoudsolie"],"img":"","imgs":[],"sd":"<ul> <li>Onderhoudsolie met een <strong>matte uitstraling</strong></li> <li>Voor onderhoud van uw vloer of meubelstuk die behandeld zijn met Wasolie of Hardwaxolie F-serie</li> <li>Ongeveer twee keer per jaar dun aanbrengen als onderhoud</li> <li>Het opfrissen van de meest belopen plekken.</li> <li>Ook wel bekend onder de naam Onderhoudswasolie Naturel Mat 3000-30</li> <li>Verbruik: 70 m² per liter</li> </ul>","d":"<h3>Onderhoudswasolie Naturel Mat: De Beste Keuze voor het Onderhoud van Uw Vloer of Meubelstuk</h3> <p>Het onderhouden van uw houten vloer of meubelstuk is essentieel om de natuurlijke schoonheid en duurzaamheid te behouden. <strong>Onderhoudswasolie Naturel Mat</strong> biedt de perfecte oplossing voor een optimaal resultaat.</p> <p>Bij regulier onderhoud adviseren wij om uw vloer of meubelstuk <strong>twee keer per jaar</strong> te behandelen met Onderhoudswasolie Naturel Mat. Dankzij de unieke samenstelling heeft deze olie een lagere viscositeit, waardoor u slechts een dunne beschermlaag aanbrengt. Dit voorkomt onnodige ophoping van olie en zorgt voor een natuurlijke uitstraling. Bovendien helpt het product om het verlies van olie door slijtage en schoonmaken effectief tegen te gaan.</p> <h4>Voordelen van Onderhoudswasolie Naturel Mat:</h4> <ul> <li><strong>Eenvoudig in gebruik</strong>: dunne en gelijkmatige aanbrengmethode.</li> <li><strong>Hoge kwaliteit</strong>: herstelt en beschermt het hout tegen slijtage.</li> <li><strong>Snelle droogtijd</strong>: na ongeveer 12 uur is het oppervlak weer volledig klaar voor gebruik.</li> </ul> <h3>Gebruiksaanwijzing voor Onderhoudswasolie Naturel Mat</h3> <p>Volg onderstaande stappen voor een optimaal resultaat:</p> <ol> <li><strong>Maak het oppervlak stofvrij:</strong> Gebruik een droge doek of stofzuiger. Vermijd vochtige reiniging, omdat dit de opname van de olie kan belemmeren.</li> <li><strong>Schud of roer de olie goed:</strong> Zorg ervoor dat de olie gelijkmatig gemengd is.</li> <li><strong>Breng de olie dun aan:</strong> Gebruik een borstel of kwast om de olie in een dunne, gelijkmatige laag aan te brengen.</li> <li><strong>Verwijder overtollige olie direct:</strong> Gebruik een niet-pluizende doek en laat de olie <strong>niet</strong> indrogen.</li> <li><strong>Laat drogen:</strong> De olie heeft een droogtijd van ongeveer <strong>12 uur</strong>.</li> <li><strong>Beperk reiniging na behandeling:</strong> Gebruik de eerste twee weken geen reinigingsmiddelen om de olie optimaal te laten intrekken.</li> </ol> <p><strong>Kies voor Onderhoudswasolie Naturel Mat</strong> om de levensduur en uitstraling van uw vloer of meubelstuk te verlengen. Bestel vandaag nog en geef uw hout het onderhoud dat het verdient!</p>","p":2995,"r":2995,"sale":false,"stock":true,"v":[{"id":1862,"l":"1 liter","p":2995,"r":2995,"s":true}],"a":{"Inhoud":"250 ml, 500 ml, 1 liter","Kleuren":"Naturel Mat"},"opt":false},{"id":1704,"n":"Waterbeits Antraciet W78207","s":"waterbeits-antraciet-w78207","t":"variable","c":["sale"],"img":"","imgs":[],"sd":"<ul> <li>Waterbeits in de kleur: Antraciet W78207</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> </ul>","d":"<h2>Beits op waterbasis</h2> <p>Waterbeits Antraciet W78207 is een dunne, op water gebaseerde beits die zeer geschikt is voor het kleuren van hout zonder de natuurlijke uitstraling van het h [],"sd":"<ul> <li>Nitrobeits in de kleur CBM 261 Kersen Egaal</li> <li>Professionele beits op basis van nitro-oplosmiddelen</li> <li>Verbruik: 1 liter per 15 vierkante meter</li> </ul>","d":"<p>Nitrobeits CBM 261 Kersen Egaal is een professionele beits die zeer geschikt is voor eiken. Maar ook op ander houtsoorten kunt u Nitrobeits CBM 261 Kersen Egaal gebruiken. Bij speciale houtsoorten is het wel aanbevolen om de Nitrobeits CBM 261 Kersen Egaal eerst uit te testen. Houtsoorten zoals beukenhout hebben namelijk speciale behandeling nodig om te voorkomen dat er vlekken ontstaan. Nitrobeits CBM 261 Kersen Egaal is gemaakt op basis van nitro-oplosmiddelen en vraagt daarom wat meer ervaring voor de verwerking ervan.</p> <h2>Gebruiksaanwijzing</h2> <p>De Nitrobeits CBM 261 Kersen Egaal voor gebruik goed schudden of doorroeren om kleurverschillen te voorkomen. Gebruik voor het aanbrengen van de beits altijd schoon gereedschap.</p> <p>Wanneer de beits te dik is aangebracht kunt u het met een spons of doek egaliseren. U dient de beits goed te laten drogen om problemen bij de afwerking te voorkomen.</p> <p>Voor het afwerken wordt <a href=\"#\" target=\"_blank\" rel=\"noopener\">wasolie Naturel</a>, <a href=\"#\" target=\"_blank\" rel=\"noopener\">Naturel Mat</a> of <a href=\"#\" target=\"_blank\" rel=\"noopener\">PU-lak</a> aangeraden.</p>","p":9995,"r":12895,"sale":true,"stock":true,"v":[{"id":1597,"l":"CBM 261 Kersen Egaal","p":9995,"r":12895,"s":true}],"a":{"Inhoud":"Proefpotje, 1 liter, 5 liter","Kleuren":"CBM 261 Kersen Egaal"},"opt":false},{"id":1554,"n":"Teakfix","s":"teakfix","t":"variable","c":["lakken","overige-lakken"],"img":"","imgs":[],"sd":"<ul> <li>Teakfix geeft uw meubelen een onbehandelde uitstraling!</li> <li>Een goede bescherming tegen vocht en vuil met Teakfix!</li> <li>Wordt ook wel Woodfix genoemd</li> <li>Verbruik: 20 m² per liter</li> </ul>","d":"<p>Het aanbrengen van Teakfix zorgt voor een bijna kleurloze beschermlaag op uw meubelstuk. Wanneer u dezelfde kleur wilt behouden maar toch een beschermlaag wenst, dan is Teakfix een ideale oplossing.</p> <p>Eens per jaar het hout goed schoonborstelen en licht opschuren, waarna er een nieuwe laag met Teakfix aangebracht kan worden.</p> <p>Kijk eerst uw meubelstuk na op eventueel kleine scheurtjes of gaatjes. Deze kunt u het beste schuren en stoppen met <a href=\"#\" target=\"_blank\" rel=\"noopener\">vloeibaar hout</a>. Breng eerst een dun laagje Teakfix aan met een kwast en veeg overtollige olie direct weg met een doek. Laat deze laag ongeveer 4 tot 5 uur drogen en schuur het meubelstuk dan weer licht op. Na het afstoffen kunt u de tweede laag aanbrengen en eventueel ook een derde laag.</p>","p":3295,"r":3295,"sale":false,"stock":true,"v":[{"id":1557,"l":"1 liter","p":3295,"r":3295,"s":true},{"id":40452,"l":"5 liter","p":14995,"r":14995,"s":true}],"a":{"Inhoud":"Proefpotje, 500 ml, 1 liter, 5 liter","Aanbrengen":"Kwast","Droogtijden":"4 tot 5 uur per laag","Verbruik":"20 m² / liter"},"opt":false},{"id":1468,"n":"Ammonia (hout ontvetter)","s":"ammonia-hout-ontvetter","t":"simple","c":["onderhoudsmiddelen-en-reparatie","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Gebruik ammonia voor het ontvetten van uw vloer of meubelstuk.</li> </ul>","d":"<p>Voordat u een houten meubelstuk of vloer gaat behandelen met een nieuwe afwerklaag, is het belangrijk deze eerst goed te ontvetten. Uitleg over de te volgen stappen kunt u hier bekijken:</p> <h2><a href=\"#\" target=\"_blank\" rel=\"noopener\">Stappenplan hout ontvetten</a></h2>  <p>Deze ammonia bevat ongeveer 5% ammonium wat voldoende is om het hout op een veilige manier te ontvetten. Schuur eerst alle oude afwerklagen van het hout en ontvet daarna met de ammonia. Na het opdrogen van de ammonia kunt u het hout opnieuw afwerken.</p>","p":235,"r":235,"sale":false,"stock":false,"v":[],"a":{"Inhoud":"1 liter","Geschikt voor":"Schoonmaken en ontvetten van metaal, hout, schilderwerk, tegels, kunststof, etc."},"opt":false},{"id":1449,"n":"Woodfix / Woodprotector","s":"woodfix-woodprotector","t":"variable","c":["lakken","overige-lakken"],"img":"","imgs":[],"sd":"<ul> <li>Woodfix geeft uw meubels een onbehandelde uitstraling!</li> <li>Goede bescherming tegen vocht en vuil met Woodfix!</li> <li>Verbruik: 20 m² per liter</li> </ul>","d":"<p>Het aanbrengen van Woodfix / Woodprotector zorgt voor een bijna kleurloze afsluiting op uw meubelstuk. Wanneer u dezelfde kleur wilt behouden maar toch een beschermlaag wenst, dan is Woodfix de ideale oplossing.</p> <p>Eens per jaar het hout goed schoonborstelen en licht opschuren, waarna er een nieuwe laag met Woodfix aangebracht kan worden.</p> <p>Kijk eerst uw meubelstuk na op eventueel kleine scheurtjes of gaatjes. Deze kunt u het beste schuren en stoppen met <a href=\"#\" target=\"_blank\" rel=\"noopener\">vloeibaar hout</a>. Breng eerst een dun laagje Woodfix / Woodprotector aan met een kwast en veeg het overtollige direct weg met een doek. Laat deze laag ongeveer 4 tot 5 uur drogen en schuur het meubelstuk dan weer licht op. Na het afstoffen kunt u de tweede laag aanbrengen en eventueel ook een derde laag.</p>","p":3295,"r":3295,"sale":false,"stock":true,"v":[{"id":1451,"l":"1 liter","p":3295,"r":3295,"s":true},{"id":40393,"l":"5 liter","p":14995,"r":14995,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Aanbrengen":"Kwast","Droogtijden":"4 tot 5 uur per laag","Verbruik":"20 m² / liter"},"opt":false},{"id":1429,"n":"Waterbeits Gideon kleur 7","s":"gideon-kleurbeits-kleur-7","t":"variable","c":["sale"],"img":"","imgs":[],"sd":"<ul> <li>Gideon Waterbeits in de kleur 7</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> </ul>","d":"<h2>Beits op waterbasis</h2> <p>Waterbeits in de Gideon kleur 7 is een dunne, op water gebaseerde beits die zeer geschikt is voor het kleuren van hout zonder de natuurlijke uitstraling van het hout kwijt te raken.</p> <p>Het kan nodig zijn om hout op kleur te brengen. Dit geldt voor nieuw hout maar kan ook gelden voor oud hout waarvan de oude afwerklaag is verwijderd. Hout kleuren doen we met beits en zeker niet met een boenwas of kleurwas. Om hout te kleuren zijn verschillende producten leverbaar. Welke u kiest is afhankelijk van de toepassing en de nabehandeling.</p> <p>Waterbeits is verkrijgbaar in veel verschillende kleuren zoals: Noten, Mahonie, Kersen, maar ook in mooie grijze of zwarte tinten. Waterbeits is zeer goed te gebruiken op gangbare houtsoorten zoals eiken, grenen, teak, kersen enz. enz. Door het gebruik van Waterbeits worden de eigenschappen en kleur van houtsoorten ook verstérkt. Mahonie bijvoorbeeld is een rode houtsoort die roder wordt en een intensere kleur krijgt wanneer ze behandeld wordt met Waterbeits Mahonie.</p> <h3>Uitstraling en bescherming</h3> <p>Door het hout meerdere keren te behandelen met Waterbeits zal de kleur donkerder / intenser worden. Omdat waterbeits van zichzelf geen bescherming geeft aan het hout moet deze, na droging nog wel worden afgewerkt met Was, Wasolie, Hardwaxolie of Lak.</p> <h4>Speciale houtsoorten</h4> <p> Wij raden aan om bij speciale houtsoorten de waterbeits eerst uit te testen. Houtsoorten zoals beukenhout hebben namelijk speciale behandeling nodig om te voorkomen dat er vlekken ontstaan. Ook blauwzwam of spint vragen speciale gemaakte waterbeits. </p>","p":2495,"r":2895,"sale":true,"stock":true,"v":[{"id":1431,"l":"1 liter","p":2495,"r":2895,"s":true}],"a":{"Inhoud":"Proefpotje, 1 liter, 5 liter","Kleuren":"Gideon 7","Aanbrengen":"Roller, kwast, pluisvrije doek of spuit","Verbruik":"12 – 15 m² / liter"},"opt":false},{"id":1408,"n":"Wasbeits (zuivere bijenwas) Kleur 3","s":"wasbeits-zuivere-bijenwas-kleur-3","t":"simple","c":[],"img":"","imgs":[],"sd":"<ul> <li><strong>NU MET 50% KORTING!</strong></li> <li>Natuurzuiver bijenwas product in de kleur 3</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<p>Wasbeits in de kleur 3 is een decoratieve oplosmiddelvrije kleurbeits op basis van natuurzuivere bijenwas welke op diverse houtsoorten gebruikt kan worden. Hij geeft het hout een natuurlijke uitstraling. U kunt over deze wasbeits geen laklaag aanbrengen. De Wasbeits kleur 3 krijgt z’n glans als deze na droging goed wordt uitgeborsteld. U kunt het meubel enigszins beschermen tegen vochtvlekken als u afwerkt met <a href=\"#\" target=\"_blank\" rel=\"noopener\">Blanke Boenwas</a>.</p>","p":1285,"r":2575,"sale":true,"stock":true,"v":[],"a":{"Inhoud":"1 liter","Kleuren":"Kleur 3","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":1386,"n":"Structuurolie 2-40 VK Midden Bruin","s":"structuurolie-2-40-vk-midden-bruin","t":"variable","c":[],"img":"","imgs":[],"sd":"<ul> <li>Midden Bruine structuurolie die bescherming biedt tegen vocht en vuil</li> <li>Eenvoudig aan te brengen door middel van roller, kwast, doek of spuit</li> <li>Geeft uw meubelstuk of vloer een midden bruine uitstraling</li> </ul>","d":"<h2>Structuurolie Midden Bruin is een product om uw houten vloeren en meubels tegen vochtvlekken en oppervlakkige kringen te beschermen.</h2>  <p>Na een behandeling met structuurolie kunt u het hout gewoon afnemen met een natte doek. Wel is het belangrijk om de gebruiksaanwijzing goed op te volgen voor een optimaal resultaat.</p> <p>U kunt voor het aanbrengen van structuurolie het hout eventueel eerst kleuren met een watergedragen beits of nitrobeits. Wanneer deze beits goed gedroogd is kunt u de structuurolie aanbrengen. Om te voorkomen dat de olie niet (of zeer slecht) droogt, dient de structuurolie zeer dun opgebracht te worden met een roller, kwast of pluisvrije doek. Eventuele overtollige structuurolie gelijk weghalen met een pluisvrije doek. Zo wordt voorkomen dat de olie te dik opgezet wordt.</p> <p>De eerste laag is meestal snel droog omdat deze in het hout trekt. Wanneer de olie niet meer plakt kan er een tweede laag op dezelfde manier aangebracht worden. Het is aan te bevelen minimaal 2 à 3 lagen aan te brengen. Als de structuurolie na twee lagen ruw wordt, kunt u het geheel het beste licht opschuren (bijvoorbeeld met schuurpapier korrel 220) Hierna kunt u de volgende dunne laag structuurolie aanbrengen.</p> <p>Bij een houten vloer dient u, na de laatste laag, de structuurolie 48 uur te laten uitharden voordat de meubels op de vloer geplaatst worden. De vloer en meubels kunnen met Structuurolie onderhouden worden indien het nodig is en Wax &amp; Clean kunt u gebruiken voor het schoonmaken. Wij raden u aan om altijd een proefplankje te maken voordat u aan de vloer of meubels begint.</p> <p><strong>Let op</strong>: met olie doordrenkte doeken zijn zelfontvlambaar! Bij de uitharding hiervan komt warmte vrij. Gebruikte doeken, sponsen, pads e.d. onder water bewaren of uitgevouwen laten drogen om mogelijke zelfontbranding door broei te vermijden.</p>","p":295,"r":295,"sale":false,"stock":false,"v":[{"id":1389,"l":"Proefpotje","p":295,"r":295,"s":false},{"id":30109,"l":"500 ml","p":2095,"r":2095,"s":false},{"id":1388,"l":"1 liter","p":2995,"r":2995,"s":false}],"a":{"Inhoud":"Proefpotje, 500 ml, 1 liter","Geschikt voor":"Houten meubelen en vloeren","Aanbrengen":"Roller, kwast, pluisvrije doek of spuit","Droogtijden":"48 uur uitharden","Verbruik":"25 m² / liter","Kleuren":"Midden Bruin"},"opt":false},{"id":1369,"n":"PU-Lak Hoogglans – Avis","s":"pu-lak-hoogglans","t":"variable","c":["tester","lakken","pu-lak"],"img":"","imgs":[],"sd":"<ul> <li>Hoogglans</li> <li>Geschikt voor alle houten vloeren en meubelen</li> <li>Geeft een goede beschermlaag met een Hoogglans uitstraling</li> <li>Kan over (bijna) alle soorten beits gebruikt worden</li> <li>Verbruik: 10 tot 12 m² per liter</li> </ul>","d":"<h2>Zeer slijtvaste lak</h2> <p>De PU-Lak Hoogglans is te gebruiken voor alle soorten houten vloeren en meubelen. Ook op een betonnen aanrechtblad kunt u deze PU-lak gebruiken. De PU-Lak Hoogglans is te gebruiken over (bijna) alle soorten beits en geeft een goede bescherming tegen vocht en vuil. De lak is te verkrijgen in mat, zijdeglans en hoogglans. Deze PU-Lak geeft een Hoogglans uitstraling.</p> <p>Breng de PU-Lak Hoogglans 2 tot 3 maal dun en gelijkmatig aan met een roller en/of kwast. Houdt tussen de lagen door 6 tot 12 uur droogtijd aan. Tussen de lagen steeds licht opschuren.<br> Kwast of roller reinigen met<a href=\"#\" target=\"_blank\" rel=\"noopener\"> Terpentine</a>.</p>","p":295,"r":295,"sale":false,"stock":true,"v":[{"id":1372,"l":"Proefpotje","p":295,"r":295,"s":false},{"id":1371,"l":"1 liter","p":4295,"r":4295,"s":true}],"a":{"Inhoud":"Proefpotje, 1 liter, 5 liter","Geschikt voor":"Houten meubelen en vloeren","Aanbrengen":"Roller of kwast","Droogtijden":"Tussen de lagen door 6 tot 12 uur laten drogen","Verbruik":"10 tot 12 m² / liter","Kleuren":"Blank Hoogglans, Oplosmiddelhoudend"},"opt":false},{"id":1359,"n":"PU-Lak Mat – Avis","s":"pu-lak-mat","t":"variable","c":["tester","lakken","pu-lak"],"img":"","imgs":[],"sd":"<ul> <li>Mat</li> <li>Geschikt voor alle houten vloeren en meubelen</li> <li>Zeer kras- en slijtvast met een matte uitstraling</li> <li>Kan over (bijna) alle soorten beits gebruikt worden</li> <li>Verbruik: 10 tot 12 m² per liter</li> </ul>","d":"<h2>Zeer slijtvaste matte lak</h2> <p>De PU-Lak Mat is te gebruiken voor alle soorten houten vloeren en meubelen, zelfs voor zwaar belaste toepassingen zoals bijv. horeca. Zeer slijt- en krasvast. Ook op betonnen aanrechtbladen kunt u deze PU-lak mat gebruiken. De PU-Lak Mat is te gebruiken over (bijna) alle soorten beits en geeft een goede bescherming tegen vocht en vuil. De lak is te verkrijgen in mat, satijn en hoogglans. Deze PU-Lak geeft een matte uitstraling.<br> Breng de PU-Lak Mat 2 tot 3 maal dun en gelijkmatig aan met een roller of kwast. Houdt tussen de lagen door 6 tot 12 uur droogtijd aan. Tussen de lagen steeds licht opschuren.<br> Kwast of roller reinigen met <a href=\"#\" target=\"_blank\" rel=\"noopener\">Terpentine</a>.</p>","p":295,"r":295,"sale":false,"stock":true,"v":[{"id":39682,"l":"Proefpotje","p":295,"r":295,"s":false},{"id":1361,"l":"1 liter","p":5000,"r":5000,"s":true}],"a":{"Inhoud":"Proefpotje, 1 liter, 5 liter","Geschikt voor":"Houten meubelen en vloeren","Aanbrengen":"Roller of kwast","Droogtijden":"Tussen de lagen door 6 tot 12 uur laten drogen","Verbruik":"10 tot 12 m² / liter","Kleuren":"Oplosmiddelhoudend, Mat, Transparant"},"opt":false},{"id":1354,"n":"Antiekwas / Boenwas Antiekbruin","s":"antiekwas-boenwas-antiekbruin","t":"variable","c":[],"img":"","imgs":[],"sd":"<ul> <li>Reinigt, beschermt en conserveert uw antieke meubelen</li> <li>Antiekwas / Boenwas in de kleur: <strong>Antiek Bruin</strong></li> <li>Onderhoud met boenwas antiekbruin laat uw meubelen glimmen en kleine krasjes verdwijnen</li> </ul>","d":"<p>Antiekwas / boenwas Antiek Bruin is een universele meubelwas waarmee u uw meubelen kunt onderhouden. Deze boenwas heeft een geel grenen kleur.<br> De was is gemaakt van verschillende wassoorten (zoals bijenwas, carnaubawas e.d.) en zuivere terpentijn en is geschikt voor alle houtsoorten.</p> <p>Boenwas reinigt, beschermt en conserveert uw meubelstuk. Meubelen die al eerder met was of lak behandeld zijn kunnen met boenwas onderhouden worden. Een behandeling met de was zorgt er voor dat uw meubelstuk weer een mooie glans krijgt en laat oppervlakkige krassen en vlekken verdwijnen.</p> <p>de Vesting Boenwas is eenvoudig te gebruiken. Breng de boenwas aan met een doek of kwast en laat de was goed drogen. Als de was droog is goed uitboenen met een zachte borstel of doek.</p>","p":1235,"r":1235,"sale":false,"stock":false,"v":[{"id":1357,"l":"370 ml","p":1235,"r":1235,"s":false}],"a":{"Inhoud":"Proefpotje, 370 ml, 1 liter","Kleuren":"Antiek Bruin","Aanbrengen":"Kwast"},"opt":false},{"id":1317,"n":"Budgetkwast Rond / Patent","s":"wegwerpkwast-rond-patent","t": vuil aantrekken</strong>. Deze wasreiniger neemt die oude lagen volledig weg, zodat je vloer opnieuw schoon, egaal en klaar voor een <strong>nieuwe beschermende waslaag</strong> is.</p> <h2><strong>Hoe gebruik je de wasreiniger?</strong></h2> <ol> <li> <p><strong>Breng de wasreiniger onverdund aan</strong> op de vloer.<br>Giet een kleine hoeveelheid op de ondergrond.</p> </li> <li> <p><strong>Verdeel met een pad</strong><br>Laat het product een paar minuten inwerken, maar <strong>laat het niet indrogen</strong>.</p> </li> <li> <p><strong>Neem de vervuilde waslaag op</strong><br>Gebruik katoenen doeken om de losgeweekte was te verwijderen.</p> </li> <li> <p><strong>Herhaal indien nodig</strong><br>Bij sterk vervuilde vloeren kun je de behandeling opnieuw uitvoeren.</p> </li> <li> <p><strong>Laat de vloer volledig drogen</strong><br>Na 1–2 uur kun je het hout weer voorzien van een <strong>nieuwe laag was</strong>.</p> </li> </ol>","p":2495,"r":2495,"sale":false,"stock":true,"v":[],"a":{"Inhoud":"1 liter"},"opt":false},{"id":1255,"n":"Staalwol","s":"staalwol-grof-middel-fijn","t":"variable","c":["sale"],"img":"","imgs":[],"sd":"<ul> <li>Verkrijgbaar in Grof, Middel en Fijn</li> <li>Voor het opschuren van metalen of houten oppervlaktes</li> <li>Net een beter schuurvermogen dan een scotch brite</li> <li>Gaat zeer lang mee in gebruik</li> </ul>","d":"<p>Universeel toepasbare stalen vezels voor het slijpen, polijsten en reinigen van de meest verschillende oppervlakken van hout, metaal, steen en glas. Beproefd product voor de Ambachtsman. Staalwol is verkrijgbaar in 3 soorten namelijk Grof, Middel en Fijn.</p> <p>Staalwol 000 wordt vooral aanbevolen om te gebruiken tussen de verschillende lagen afwerkmiddel. Zo schuurt u het oppervlakte wel glad, maar met minimale beschadiging van het hout.</p>","p":150,"r":165,"sale":true,"stock":true,"v":[{"id":28894,"l":"Fijn","p":150,"r":165,"s":true},{"id":28895,"l":"Middel","p":160,"r":170,"s":true},{"id":28896,"l":"Grof","p":165,"r": ,"sale":false,"stock":false,"v":[{"id":1209,"l":"370 ml","p":1235,"r":1235,"s":false}],"a":{"Inhoud":"Proefpotje, 370 ml","Kleuren":"Wit","Aanbrengen":"Kwast"},"opt":false},{"id":1170,"n":"Wax & Clean Onderhouds-en Reinigingsmiddel","s":"wax-clean-reinigingsmiddel-onderhoudsmiddel","t":"variable","c":["onderhoudsmiddelen-en-reparatie","onderhoudsolie","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Voor de wekelijkse schoonmaakbeurt van uw vloer.</li> <li>20 &#8211; 30 ml wax &amp; clean per liter water</li> <li>Houdt uw vloer in top conditie!</li> </ul>","d":"<h2>Wax &amp; Clean – Onderhoud en Reiniging voor Houten Vloeren met Hardwaxolie of Was</h2> <p><strong>Bescherm en Reinig Houten Vloeren met Wax &amp; Clean</strong><br> Wax &amp; Clean is een speciaal ontwikkeld onderhouds- en reinigingsmiddel op waterbasis voor houten vloeren die behandeld zijn met hardwaxolie of was. Deze veelzijdige reiniger biedt niet alleen optimale reiniging maar zorgt ook voor een duurzame beschermlaag. Deze beschermlaag voorkomt vocht- en vlekvorming en heeft bovendien een anti-slip effect voor veilig gebruik in huis.</p> <p><strong>Gebruiksaanwijzing voor een Langdurig Resultaat</strong><br> Om Wax &amp; Clean optimaal te laten werken, is het belangrijk om het aan te brengen na een wachttijd van minimaal 21 dagen na de laatste was- of hardwaxolielaag. Voeg vervolgens ongeveer 200-300 ml Wax &amp; Clean toe aan 10 liter water en dweil de vloer met een lichtvochtige mop of doek. Gebruik niet te veel water en neem het overtollige vocht direct op om de vloer in topconditie te houden.</p> <h3>Belangrijkste Eigenschappen en Voordelen van Wax &amp; Clean:</h3> <ul> <li><strong>Dubbele Werking</strong>: Reinigt en onderhoudt houten vloeren met één enkel product, ideaal voor hardwaxolie- en met was behandelde vloeren.</li> <li><strong>Vocht- en Vlekbestendig</strong>: De dunne beschermlaag voorkomt vocht- en vlekvorming en verlengt de levensduur van uw vloer.</li> <li><strong>Anti-slip Effect</strong>: Veilig voor dagelijks gebruik zonder verlies van grip.</li> <li><strong>Gebruiksvriendelijk</strong>: Gemakkelijk te mengen en aan te brengen met een mop of doek, zonder de vloer te beschadigen.</li> <li><strong>Lange Houdbaarheid</strong>: Bewaar het product in de originele, gesloten verpakking op een vorstvrije plek voor een lange gebruiksduur.</li> </ul> <h3>Voor wie is Wax &amp; Clean Geschikt?</h3> <p>Wax &amp; Clean is ideaal voor gebruikers die hun houten vloer met hardwaxolie of was behandeld hebben en deze in optimale conditie willen houden. Dit product combineert reiniging en onderhoud, zodat u uw vloer eenvoudig kunt beschermen tegen dagelijks gebruik.</p> <h3>Veilig en Effectief Opslagadvies</h3> <p>Bewaar Wax &amp; Clean altijd in de originele, gesloten verpakking en op een vorstvrije plek voor langdurige houdbaarheid en optimale werking. Let op: de geschiktheid voor specifieke toepassingen kan variëren, dus test het product altijd op een kleine, onopvallende plek om zeker te zijn van de juiste werking.</p> <p><strong>Conclusie: De Complete Oplossing voor een Langdurig Mooie Houten Vloer</strong><br> Met Wax &amp; Clean kiest u voor een veelzijdig onderhoudsmiddel dat zowel reinigt als beschermt, waardoor uw houten vloer lang mooi en veilig blijft. Ideaal voor hardwaxolie- en wasvloeren, Wax &amp; Clean zorgt voor een natuurlijke glans en beschermt tegen vocht en vlekken voor een duurzaam resultaat.</p> <p><strong>Bestel Wax &amp; Clean vandaag en geniet van een eenvoudige manier om uw houten vloer in topconditie te houden!</strong></p>","p":1995,"r":1995,"sale":false,"stock":true,"v":[{"id":1173,"l":"1 liter","p":1995,"r":1995,"s":true},{"id":29875,"l":"5 liter","p":4985,"r":4985,"s":true}],"a":{"Inhoud":"2,5 liter, 500 ml, 1 liter, 5 liter","Geschikt voor":"Houten meubelen en vloeren, Vloer & Parket","Aanbrengen":"Dweil, Mop, Spons of doek"},"opt":false},{"id":1166,"n":"Onderhoudsolie Naturel Zijdeglans","s":"onderhoudswasolie-naturel-zijdeglans","t":"variable","c":["onderhoudsmiddelen-en-reparatie","onderhoudsolie"],"img":"","imgs":[],"sd":"<ul> <li>Ook bekend als:<strong> Onderhoudswasolie Naturel Zijdeglans 3000</strong></li> <li>Lichte zijdeglans uitstraling</li> <li>Voor onderhoud van uw vloer of meubelstuk die behandeld zijn met Wasolie of Hardwaxolie F-serie</li> <li>Ongeveer twee keer per jaar dun aanbrengen als onderhoud</li> <li>Het opfrissen van de meest belopen plekken.</li> <li>Verbruik: 70 m² per liter</li> </ul>","d":"<p><strong>Onderhoudswasolie Naturel Zijdeglans: Perfecte Bescherming voor Uw Vloer en Meubels</strong></p> <p>Wilt u uw houten vloer of meubelstuk in topconditie houden? Kies voor de <strong>Onderhoudswasolie Naturel Zijdeglans</strong>! Deze hoogwaardige olie is speciaal ontwikkeld om uw vloer of meubel te beschermen en te verzorgen. Voor een optimaal resultaat adviseren wij een onderhoudsbeurt met deze olie <strong>twee keer per jaar</strong>.</p> <p>Dankzij de lage viscositeit (dunne samenstelling) van de Onderhoudswasolie brengt u slechts een <strong>dun laagje olie</strong> aan, in plaats van een dikke laag. Dit is niet alleen efficiënter, maar voorkomt ook overmatige ophoping van olie. Met de Onderhoudswasolie compenseert u het verlies van olie door slijtage en schoonmaken, zodat uw vloer of meubel zijn natuurlijke glans en bescherming behoudt.</p>  <h3><strong>Gebruiksaanwijzing voor Onderhoudswasolie</strong></h3> <p>Volg deze stappen voor het beste resultaat:</p> <ol> <li><strong>Maak het oppervlak stofvrij</strong><br> Zorg dat uw vloer of meubel volledig schoon en droog is. <strong>Vochtig reinigen wordt afgeraden</strong>, omdat dit de opname van de olie kan verminderen.</li> <li><strong>Schud of roer de olie goed</strong><br> Bereid de olie voor gebruik voor door deze goed te mengen.</li> <li><strong>Aanbrengen met een borstel of kwast</strong><br> Breng de Onderhoudswasolie <strong>dun en gelijkmatig</strong> aan. Gebruik hierbij een borstel of kwast en verwijder overtollige olie direct met een niet-pluizende doek. Laat de olie niet indrogen.</li> <li><strong>Laat de olie drogen</strong><br> De droogtijd bedraagt ongeveer <strong>12 uur</strong>. Hierna kunt u de vloer belopen of het meubelstuk weer gebruiken.</li> <li><strong>Beperk onderhoud in de eerste weken</strong><br> Gebruik de eerste twee weken geen reinigings- of onderhoudsmiddelen om de olie volledig te laten uitharden.</li> </ol>  <p>Met de <strong>Onderhoudswasolie Naturel Zijdeglans</strong> blijft uw vloer of meubel duurzaam mooi, beschermd en in topconditie. Ontdek vandaag nog hoe eenvoudig onderhoud kan zijn en geef uw houten oppervlakken een langdurige glans!</p>","p":2995,"r":2995,"sale":false,"stock":true,"v":[{"id":1167,"l":"1 liter","p":2995,"r":2995,"s":true}],"a":{"Inhoud":"250 ml, 500 ml, 1 liter","Kleuren":"Naturel, Zijdeglans"},"opt":false}],"cats":[{"id":61,"n":"Antiekwas / Boenwas","s":"antiekwas-boenwas","par":348,"k":8,"img":""},{"id":430,"n":"Beits voor Buiten","s":"beits-voor-buiten","par":108,"k":11,"img":""},{"id":62,"n":"Beitsen","s":"hout-kleuren-met-oneindig-veel-kleuren","par":0,"k":80,"img":""},{"id":108,"n":"Bescherming voor Buiten","s":"onderhoud-en-bescherm-je-hout-ook-buiten-demo-meubelwebshop","par":0,"k":34,"img":""},{"id":537,"n":"Bijenwas","s":"bijenwas","par":348,"k":1,"img":""},{"id":112,"n":"Diversen","s":"diversen","par":63,"k":5,"img":""},{"id":488,"n":"Elektrisch Gereedschap","s":"elektrisch-gereedschap","par":63,"k":2,"img":""},{"id":15,"n":"Geen categorie","s":"geen-categorie","par":0,"k":7,"img":""},{"id":63,"n":"Gereedschap","s":"gereedschap","par":0,"k":9,"img":""},{"id":329,"n":"Hardwax olie F-Serie","s":"hardwax-olie-f-serie","par":67,"k":27,"img":""},{"id":699,"n":"Invisible Oil","s":"invisible-oil-waterbaseerd","par":67,"k":2,"img":""},{"id":347,"n":"Kleurbeits KAT","s":"kleurbeits-kat","par":62,"k":13,"img":""},{"id":107,"n":"Kwasten / Rollers","s":"kwasten-en-rollers","par":63,"k":4,"img":""},{"id":538,
