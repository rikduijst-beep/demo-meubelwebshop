<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Meubelwebshop | Demo-webshop voor meubel- en vloerproducten</title>
<meta name="description" content="Alles voor het kleuren, beschermen, herstel en onderhoud van uw meubels en vloeren. Hardwaxolie, beits, lak, was en gereedschap.">
<meta name="theme-color" content="#6E7645">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Demo Meubelwebshop — vernieuwd design
   Huisstijl: olijfgroen + crème + oranje accent, uil-logo. */
:root{
  --olive:#6E7645;          /* huisstijl-groen */
  --olive-light:#B9BE9C;    /* header-groen */
  --olive-dark:#32371C;     /* donker olijf */
  --paint:#5E6638;          /* verf-overgang: net iets donkerder dan het huisstijl-groen */
  --cream:#F2F3EC;
  --paper:#FBFBF7;
  --card:#FFFFFF;
  --ink:#22260F;
  --ink-soft:#5B604A;
  --line:#DDE0CF;
  --orange:#FF5D00;
  --on-orange:#1F1300;
  --wood:#C89B6A;
  --ok:#3F7A3A;
  --danger:#B3261E;
  --r-s:10px; --r-m:18px; --r-l:28px;
  --shadow-s:0 2px 8px rgba(50,55,28,.08);
  --shadow-m:0 12px 32px rgba(50,55,28,.14);
  --shadow-l:0 28px 60px rgba(50,55,28,.22);
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:"Fraunces",Georgia,serif;
  --body:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
  --wrap:1280px;
}
:root[data-theme="night"]{
  --cream:#171a0d; --paper:#1d2111; --card:#252a16; --ink:#EEF0E2; --ink-soft:#B4B99C;
  --line:#3a4023; --olive-light:#4b5230; --shadow-s:0 2px 8px rgba(0,0,0,.4); --shadow-m:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:hidden;transition:background .4s,color .4s}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.08;margin:0 0 .5em;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(2.4rem,5.6vw,4.8rem)}
h2{font-size:clamp(1.8rem,3.4vw,2.9rem)}
h3{font-size:1.3rem}
p{margin:0 0 1em}
::selection{background:var(--paint);color:#fff}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(16px,3.5vw,40px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:fixed;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:999;transition:top .2s}
.skip:focus{top:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* scroll-voortgang als verfstreek */
.scroll-stroke{position:fixed;inset:0 0 auto 0;height:5px;z-index:120;pointer-events:none}
.scroll-stroke span{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--orange),#ff8a3d);border-radius:0 6px 6px 0}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:100;background:var(--olive);color:#fff;transition:transform .35s var(--ease),box-shadow .3s}
.site-header.hide{transform:translateY(-100%)}
.site-header.scrolled{box-shadow:var(--shadow-m)}
.topbar{background:var(--olive-dark);font-size:.84rem}
.topbar-in{display:flex;gap:28px;justify-content:center;padding-block:7px;flex-wrap:wrap}
.topbar-in>*{display:flex;align-items:center;gap:7px;text-decoration:none;opacity:.92}
.topbar-in a:hover{opacity:1;text-decoration:underline}
.topbar .ic{width:16px;height:16px}
.header-main{display:flex;align-items:center;gap:clamp(12px,3vw,36px);padding-block:12px}
.logo{display:block;flex:none;transition:transform .3s var(--ease)}
.logo:hover{transform:rotate(-2deg) scale(1.04)}
.logo img{height:48px;width:auto}
.search{position:relative;flex:1;max-width:560px;margin-inline:auto}
.search>.ic{position:absolute;left:16px;top:50%;translate:0 -50%;color:var(--olive-dark);pointer-events:none}
.search input{width:100%;height:48px;border-radius:99px;border:2px solid transparent;background:#fff;color:#22260F;padding:0 18px 0 46px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,93,0,.25)}
.search-results{position:absolute;inset:calc(100% + 8px) 0 auto 0;background:var(--card);color:var(--ink);border-radius:var(--r-m);box-shadow:var(--shadow-l);padding:8px;z-index:5;max-height:70vh;overflow:auto}
.search-results a{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;text-decoration:none}
.search-results a:hover,.search-results a:focus{background:var(--cream)}
.search-results img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--cream)}
.search-results small{color:var(--ink-soft);display:block}
.search-results .sr-msg{padding:14px;color:var(--ink-soft)}
.header-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;transition:background .2s,transform .2s}
.icon-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}

/* verfblik-knop */
.can-btn{position:relative;width:56px;height:56px;border:0;background:rgba(255,255,255,.12);border-radius:50%;display:grid;place-items:center;transition:background .2s}
.can-btn:hover{background:rgba(255,255,255,.24)}
.can-btn .can{width:34px;height:38px;overflow:visible;transform-origin:50% 90%}
.can-handle{stroke:#fff;stroke-width:2;stroke-linecap:round}
.can-body{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2}
.can-rim{fill:#fff}
.can-fill{fill:var(--orange);transition:y .7s var(--ease)}
.can-drip{fill:var(--orange);transform-origin:33px 18px;transform:scaleY(0);transition:transform .5s var(--ease)}
.can-btn.has-items .can-drip{transform:scaleY(1)}
.can-btn.splash .can{animation:canWobble .7s var(--ease)}
@keyframes canWobble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.12)}55%{transform:rotate(9deg) scale(1.05)}80%{transform:rotate(-4deg)}100%{transform:none}}
.can-count{position:absolute;top:0;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--orange);color:var(--on-orange);font-weight:700;font-size:.8rem;display:grid;place-items:center;border:2px solid var(--olive)}
.can-count.bump{animation:bump .4s var(--ease)}
@keyframes bump{50%{transform:scale(1.5)}}

.main-nav{background:var(--olive-light);color:#22260F}
:root[data-theme="night"] .main-nav{color:#EEF0E2}
.nav-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav-item{position:relative;flex:none}
.nav-item>a{display:block;padding:12px 14px;text-decoration:none;font-weight:600;font-size:.96rem;white-space:nowrap;position:relative}
.nav-item>a::after{content:"";position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:3px;background:var(--olive-dark);transform:scaleX(0);transform-origin:0 50%;transition:transform .3s var(--ease)}
.nav-item>a:hover::after,.nav-item>a[aria-current]::after{transform:scaleX(1)}
.nav-item.sale>a{background:var(--orange);color:var(--on-orange);border-radius:99px;margin:6px 0 6px 8px;padding:6px 16px}
.nav-item.sale>a::after{display:none}
.nav-sub{position:fixed;min-width:260px;background:var(--card);color:var(--ink);border-radius:0 0 var(--r-m) var(--r-m);box-shadow:var(--shadow-l);padding:10px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.22s var(--ease);z-index:10}
.nav-item:hover .nav-sub,.nav-item:focus-within .nav-sub{opacity:1;visibility:visible;transform:none}
.nav-sub a{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border-radius:10px;text-decoration:none;font-size:.95rem}
.nav-sub a:hover{background:var(--cream);color:var(--olive)}
.nav-sub small{color:var(--ink-soft)}

/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:99px;border:2px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,background .2s,color .2s;will-change:transform;position:relative;overflow:hidden}
.btn-primary{background:var(--orange);color:var(--on-orange);box-shadow:0 8px 20px rgba(255,93,0,.3)}
.btn-primary:hover{box-shadow:0 14px 30px rgba(255,93,0,.42)}
.btn-olive{background:var(--olive);color:#fff}
.btn-olive:hover{background:var(--olive-dark)}
.btn-ghost{background:transparent;border-color:currentColor}
.btn-ghost:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ic{transition:transform .25s var(--ease)}
.btn:hover .ic{transform:translateX(4px)}
.link{font-weight:700;color:var(--olive);text-decoration:none;display:inline-flex;gap:6px;align-items:center;border-bottom:2px solid currentColor;padding-bottom:1px}
.link:hover{color:var(--orange)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(900px 500px at 12% 0%,rgba(185,190,156,.55),transparent 70%),var(--cream)}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(36px,7vw,96px)}
.eyebrow{display:flex;width:fit-content;align-items:center;gap:8px;font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:18px}
.eyebrow::before{content:"";width:28px;height:3px;background:var(--orange);border-radius:3px}
.hero h1 em{font-style:italic;color:var(--olive);position:relative;white-space:nowrap}
.hero h1 em svg{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.36em;overflow:visible}
.hero h1 em path{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-lead{font-size:1.2rem;color:var(--ink-soft);max-width:52ch}
.usps{list-style:none;padding:0;margin:22px 0 30px;display:grid;gap:9px}
.usps li{display:flex;gap:12px;align-items:center;font-weight:500}
.usps .ic{width:24px;height:24px;padding:4px;border-radius:50%;background:var(--olive);color:#fff;stroke-width:2.6}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.plank{position:relative;aspect-ratio:5/5.4;border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-l);background:#cfc3b0;cursor:crosshair;touch-action:pan-y;transform:rotate(1.5deg)}
.plank img,.plank canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plank img{filter:grayscale(.9) brightness(1.25) contrast(.75) sepia(.18)}
.plank-tag{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;pointer-events:none}
.plank-tag span{background:rgba(34,38,15,.82);color:#fff;padding:8px 14px;border-radius:99px;font-size:.88rem;font-weight:600;backdrop-filter:blur(6px);display:flex;gap:8px;align-items:center}
.plank-tag .ic{width:16px;height:16px}
.hero-blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none}
.hero-swatches{position:absolute;right:-14px;top:8%;display:grid;gap:10px;z-index:2}
.hero-swatches i{width:54px;height:54px;border-radius:14px;box-shadow:var(--shadow-m);border:3px solid #fff;transform:rotate(var(--rot))}

/* marquee */
.marquee{background:var(--olive-dark);color:var(--olive-light);overflow:hidden;padding:14px 0;font-family:var(--display);font-size:1.5rem;font-style:italic;white-space:nowrap;user-select:none}
.marquee-track{display:inline-flex;gap:38px;will-change:transform}
.marquee-track span{display:inline-flex;align-items:center;gap:38px}
.marquee-track span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}

/* ---------- secties ---------- */
.section{padding-block:clamp(48px,8vw,104px)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(22px,3vw,40px)}
.section-head p{color:var(--ink-soft);max-width:56ch;margin:0}
.stroke-title{position:relative;display:inline-block}
.stroke-title::after{content:"";position:absolute;left:0;bottom:-8px;height:6px;width:100%;border-radius:6px;background:var(--orange);transform:scaleX(0);transform-origin:0 50%;transition:transform .9s .2s var(--ease)}
.in .stroke-title::after,.stroke-title.in::after{transform:scaleX(.45)}

[data-reveal]{opacity:0;transform:translateY(34px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
[data-reveal="left"]{transform:translateX(-40px)}
[data-reveal="zoom"]{transform:scale(.92)}
[data-reveal].in{opacity:1;transform:none}

/* productkaart */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:clamp(14px,2vw,26px)}
.card{position:relative;background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow-s);display:flex;flex-direction:column;transition:box-shadow .3s,transform .6s var(--ease),opacity .8s var(--ease);transform-style:preserve-3d;will-change:transform}
.card:hover{box-shadow:var(--shadow-m);transition:box-shadow .3s,transform .12s linear;z-index:2}
.card-img{position:relative;aspect-ratio:1;border-radius:var(--r-m) var(--r-m) 0 0;overflow:hidden;background:var(--cream);display:block}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .card-img img{transform:scale(1.07)}
.card-img::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover .card-img::after{opacity:1}
.badge{position:absolute;top:12px;left:12px;z-index:1;background:var(--orange);color:var(--on-orange);font-weight:700;font-size:.78rem;padding:4px 11px;border-radius:99px;transform:rotate(-4deg)}
.badge.out{background:var(--ink);color:#fff}
.card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:600}
.card-name{font-family:var(--display);font-size:1.1rem;font-weight:600;line-height:1.2;text-decoration:none}
.card-name::after{content:"";position:absolute;inset:0}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px}
.price{font-weight:700;font-size:1.12rem}
.price small{font-weight:500;color:var(--ink-soft);font-size:.82rem}
.price del{color:var(--ink-soft);font-weight:400;font-size:.9rem;margin-right:6px}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ok);font-weight:600}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s infinite}
.stock.out{color:var(--danger)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,122,58,.5)}70%,100%{box-shadow:0 0 0 8px rgba(63,122,58,0)}}
.add-btn{position:relative;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:var(--olive);color:#fff;display:grid;place-items:center;transition:background .2s,transform .25s var(--ease)}
.add-btn:hover{background:var(--orange);color:var(--on-orange);transform:rotate(90deg) scale(1.08)}
.add-btn .ic{width:22px;height:22px;stroke-width:2.4}

/* keuzehulp */
.guides{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,26px)}
.guide{position:relative;min-height:440px;border-radius:var(--r-l);overflow:hidden;color:#fff;text-decoration:none;display:flex;align-items:flex-end;isolation:isolate}
.guide img{position:absolute;inset:-12% 0;width:100%;height:124%;object-fit:cover;z-index:-2;will-change:transform}
.guide::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(34,38,15,0) 30%,rgba(34,38,15,.88));z-index:-1;transition:background .4s}
.guide:hover::before{background:linear-gradient(180deg,rgba(94,102,56,.35),rgba(34,38,15,.92))}
.guide-body{padding:28px}
.guide h3{font-size:1.6rem;color:#fff}
.guide .link{color:#fff}
.guide:hover .link{color:var(--orange)}

/* categorie-bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:clamp(12px,1.6vw,20px)}
.tile{position:relative;border-radius:var(--r-m);overflow:hidden;text-decoration:none;color:#fff;display:flex;align-items:flex-end;padding:20px;isolation:isolate;background:var(--olive)}
.tile:nth-child(1){grid-column:span 2;grid-row:span 2}
.tile:nth-child(4){grid-column:span 2}
.tile:nth-child(7){grid-column:span 2}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s var(--ease)}
.tile:hover img{transform:scale(1.08) rotate(1deg)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(200deg,rgba(50,55,28,.1),rgba(50,55,28,.86))}
.tile b{font-family:var(--display);font-size:1.35rem;line-height:1.1;display:block}
.tile small{opacity:.85}
.tile .go{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;transform:scale(0) rotate(-45deg);transition:transform .35s var(--ease)}
.tile:hover .go{transform:scale(1) rotate(-45deg)}

/* horizontale kleurstrip (scroll-gestuurd) */
.strip{background:var(--olive-dark);color:#fff;overflow:hidden}
.strip .section-head p{color:var(--olive-light)}
.strip-track{display:flex;gap:22px;will-change:transform;padding-inline:clamp(16px,3.5vw,40px)}
.swatch{flex:none;width:210px;text-decoration:none;color:#fff}
.swatch img{width:210px;height:260px;object-fit:cover;border-radius:var(--r-m);transition:transform .5s var(--ease),border-radius .5s}
.swatch:hover img{transform:translateY(-10px) rotate(-2deg);border-radius:60px 18px}
.swatch b{display:block;margin-top:12px;font-family:var(--display);font-size:1.05rem;line-height:1.2}
.swatch small{color:var(--olive-light)}

/* b2b spotlight */
.b2b{position:relative;background:var(--olive);color:#fff;border-radius:var(--r-l);padding:clamp(28px,5vw,64px);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center}
.b2b::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx,70%) var(--my,30%),rgba(255,255,255,.2),transparent 60%);pointer-events:none}
.b2b h2{color:#fff}
.b2b ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.b2b li{display:flex;gap:14px;background:rgba(255,255,255,.1);padding:16px 18px;border-radius:var(--r-m);backdrop-filter:blur(4px)}
.b2b li .ic{color:var(--orange);width:26px;height:26px}
.b2b li b{display:block}

/* cijfers */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:clamp(2.4rem,5vw,4rem);color:var(--olive);line-height:1}
.stat span{color:var(--ink-soft);font-weight:600}

/* review */
.review{background:var(--card);border-radius:var(--r-l);padding:clamp(28px,5vw,60px);box-shadow:var(--shadow-s);position:relative;max-width:920px;margin-inline:auto;text-align:center}
.review blockquote{font-family:var(--display);font-size:clamp(1.15rem,2.2vw,1.6rem);font-style:italic;line-height:1.4;margin:16px 0}
.stars{display:inline-flex;gap:4px;color:var(--orange)}
.stars .ic{fill:currentColor;width:24px;height:24px}

/* ---------- winkel ---------- */
.page-hero{background:var(--olive);color:#fff;padding-block:clamp(30px,5vw,64px);position:relative;overflow:hidden}
.page-hero::after{content:"";position:absolute;right:-80px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07)}
.page-hero h1{font-size:clamp(2rem,4.6vw,3.6rem);margin:0;color:#fff}
.page-hero p{margin:10px 0 0;opacity:.9;max-width:60ch}
.crumbs{font-size:.88rem;opacity:.85;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:28px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:.92rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip:hover{border-color:var(--olive);transform:translateY(-2px)}
.chip[aria-pressed="true"],.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.select{height:44px;border-radius:99px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-weight:600}
.count{color:var(--ink-soft)}
.more{display:flex;justify-content:center;margin-top:36px}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}

/* ---------- productpagina ---------- */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);padding-block:clamp(24px,4vw,56px);align-items:start}
.gallery{position:sticky;top:150px}
.gallery-main{aspect-ratio:1;border-radius:var(--r-l);overflow:hidden;background:var(--card);box-shadow:var(--shadow-m);cursor:zoom-in;position:relative}
.gallery-main img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease-out;transform-origin:var(--zx,50%) var(--zy,50%)}
.gallery-main:hover img{transform:scale(1.9)}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;border-radius:14px;overflow:hidden;border:3px solid transparent;padding:0;background:var(--card)}
.thumbs button[aria-pressed="true"]{border-color:var(--orange)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pdp h1{font-size:clamp(1.8rem,3.4vw,2.8rem)}
.pdp-price{font-size:2rem;font-weight:700;font-family:var(--display);margin:6px 0 4px}
.pdp-price del{font-size:1.1rem;color:var(--ink-soft);font-weight:400;margin-right:10px}
.pdp-short{color:var(--ink-soft);margin:14px 0}
.opt-label{font-weight:700;margin:20px 0 8px;display:block}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-height:54px;padding:6px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.2;transition:.2s}
.opt b{display:block}
.opt small{color:var(--ink-soft)}
.opt:hover{border-color:var(--olive)}
.opt[aria-pressed="true"]{border-color:var(--olive);background:var(--olive);color:#fff}
.opt[aria-pressed="true"] small{color:#fff;opacity:.85}
.opt[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.buy{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:99px;background:var(--card);height:50px}
.qty button{width:44px;height:46px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.qty button:hover{color:var(--orange)}
.qty input{width:44px;border:0;background:none;text-align:center;font-weight:700;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.assure{display:grid;gap:8px;margin-top:22px;padding:18px;border-radius:var(--r-m);background:var(--paper);border:1px solid var(--line);font-size:.95rem}
.assure div{display:flex;gap:10px;align-items:center}
.assure .ic{color:var(--olive)}
.specs{width:100%;border-collapse:collapse;margin-top:10px}
.specs th,.specs td{text-align:left;padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs th{width:36%;font-weight:600;color:var(--ink-soft)}
.prose{max-width:76ch}
.prose h2{font-size:1.6rem;margin-top:1.4em}
.prose h3,.prose h4{margin-top:1.3em;font-size:1.2rem}
.prose ul,.prose ol{padding-left:1.2em}
.prose li{margin-bottom:.4em}
.prose a{color:var(--olive);font-weight:600}
.prose table{border-collapse:collapse;width:100%;margin:1em 0}
.prose td,.prose th{border:1px solid var(--line);padding:8px 10px;text-align:left}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:40px 0 24px}
.tab{padding:12px 20px;border:0;background:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--ink-soft)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--orange)}

/* ---------- info-pagina's ---------- */
.info{display:grid;grid-template-columns:260px 1fr;gap:clamp(24px,5vw,64px);padding-block:clamp(28px,5vw,64px);align-items:start}
.side{position:sticky;top:150px;background:var(--card);border-radius:var(--r-m);padding:12px;box-shadow:var(--shadow-s);display:grid;gap:2px}
.side a{padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.side a:hover{background:var(--cream)}
.side a[aria-current]{background:var(--olive);color:#fff}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px)}
.panel{background:var(--card);border-radius:var(--r-m);padding:clamp(20px,3vw,32px);box-shadow:var(--shadow-s)}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:.95rem}
.field input,.field textarea,.field select{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 4px rgba(110,118,69,.2)}
.field .err{color:var(--danger);font-size:.88rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact-list{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.contact-list li{display:flex;gap:12px;align-items:flex-start}
.contact-list .ic{color:var(--olive);margin-top:3px}
.demo-note{background:#FFF1E6;color:#5a2500;border:1px dashed var(--orange);padding:12px 16px;border-radius:12px;font-size:.92rem;margin-bottom:18px}
.faq details{background:var(--card);border-radius:var(--r-m);margin-bottom:12px;box-shadow:var(--shadow-s);overflow:hidden}
.faq summary{padding:18px 22px;font-weight:700;font-family:var(--display);font-size:1.12rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:14px}
.faq summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--orange);transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .prose{padding:0 22px 20px}

/* ---------- winkelmandje: het verfblik ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(34,38,15,.5);backdrop-filter:blur(3px);z-index:200;opacity:0;transition:opacity .35s}
.drawer-backdrop.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--paper);z-index:210;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .5s var(--ease);box-shadow:var(--shadow-l)}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--olive);color:#fff}
.drawer-head h2{margin:0;font-size:1.5rem;color:#fff}
.drawer-head .icon-btn{width:44px;height:44px}
.bigcan{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--card)}
.bigcan svg{width:120px;height:130px;overflow:visible;cursor:pointer;transform-origin:50% 95%;transition:transform .6s var(--ease)}
.bigcan svg.tipped{transform:rotate(-105deg) translate(-10px,20px)}
.bigcan .bc-body{fill:var(--cream);stroke:var(--olive-dark);stroke-width:3}
.bigcan .bc-rim{fill:var(--olive-dark)}
.bigcan .bc-handle{fill:none;stroke:var(--olive-dark);stroke-width:3;stroke-linecap:round}
.bigcan .bc-paint{fill:var(--paint);transition:transform .9s var(--ease)}
.bigcan .bc-wave{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.bigcan .bc-label{fill:#fff;font:700 11px var(--body);letter-spacing:.08em}
.bigcan p{margin:0;font-size:.98rem}
.bigcan b{color:var(--olive)}
.bigcan .free{color:var(--ok);font-weight:700}
.drawer-items{flex:1;overflow:auto;padding:8px 22px}
.line-item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px dashed var(--line);align-items:center;animation:itemIn .5s var(--ease) both}
@keyframes itemIn{from{opacity:0;transform:translateX(30px)}}
.line-item.drip{animation:dripOut .55s ease-in forwards}
@keyframes dripOut{to{opacity:0;transform:translateY(60px) scaleY(1.5);filter:blur(4px)}}
.line-item img{width:72px;height:72px;border-radius:50% 50% 14px 14px;object-fit:cover;background:var(--cream);border:3px solid var(--olive-light)}
.line-item a{font-weight:700;text-decoration:none;line-height:1.25;display:block}
.line-item a:hover{color:var(--olive)}
.line-item small{color:var(--ink-soft);display:block}
.line-item .qty{height:38px;margin-top:8px}
.line-item .qty button{width:34px;height:34px}
.line-item .qty input{width:34px}
.line-price{text-align:right;font-weight:700;display:grid;gap:8px;justify-items:end}
.rm{border:0;background:none;color:var(--ink-soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.rm:hover{background:#fde8e6;color:var(--danger)}
.drawer-empty{text-align:center;padding:40px 10px;color:var(--ink-soft)}
.drawer-empty svg{width:90px;height:90px;margin:0 auto 14px;color:var(--olive-light)}
.drawer-foot{padding:16px 22px 22px;border-top:1px solid var(--line);background:var(--card);display:grid;gap:10px}
.sum{display:flex;justify-content:space-between;gap:10px}
.sum.total{font-size:1.3rem;font-weight:700;font-family:var(--display);padding-top:8px;border-top:1px solid var(--line)}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;height:44px;border-radius:99px;border:2px solid var(--line);padding:0 16px;background:var(--paper);text-transform:uppercase;min-width:0}
.coupon button{height:44px;padding:0 18px;border-radius:99px;border:2px solid var(--olive);background:none;font-weight:700;color:var(--olive)}
.coupon button:hover{background:var(--olive);color:#fff}
.fly{position:fixed;z-index:300;width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--orange);pointer-events:none;box-shadow:0 4px 10px rgba(255,93,0,.5)}
.splat{position:fixed;z-index:300;width:8px;height:8px;border-radius:50%;background:var(--orange);pointer-events:none}

/* winkelmand-/afrekenpagina */
.cart-page{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(20px,4vw,48px);padding-block:clamp(28px,5vw,64px);align-items:start}
.steps{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-soft)}
.steps span i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;color:var(--ink)}
.steps span.on{color:var(--ink)}
.steps span.on i{background:var(--orange);color:var(--on-orange)}

/* ---------- footer ---------- */
.site-footer{background:var(--olive-dark);color:#E9EBDD;margin-top:clamp(40px,7vw,96px);position:relative}
.footer-drip{display:block;width:100%;height:60px;color:var(--olive-dark);margin-top:-59px;position:relative}
.footer-top{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:clamp(20px,4vw,56px);padding-block:clamp(36px,5vw,64px)}
.site-footer h3{font-size:1.1rem;color:#fff;margin-bottom:14px}
.site-footer ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.site-footer a{text-decoration:none;opacity:.86;transition:.2s}
.site-footer a:hover{opacity:1;color:var(--orange);padding-left:4px}
.footer-brand img{height:54px;width:auto;margin-bottom:16px}
.footer-brand p{opacity:.86;max-width:36ch}
.footer-contact{display:grid;gap:8px;margin-top:14px}
.footer-contact a{display:flex;gap:10px;align-items:center}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding-block:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.9rem;opacity:.9;align-items:center}
.since{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline dotted;padding:4px}
.egg-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.egg-link .ic{width:16px;height:16px}

/* ---------- overlays ---------- */
.paint{position:fixed;inset:0;z-index:500;pointer-events:none;visibility:hidden}
.paint.on{visibility:visible;pointer-events:all}
.paint canvas{position:absolute;inset:0;width:100%;height:100%}
.paint img{position:absolute;left:50%;top:50%;width:min(240px,50vw);height:auto;translate:-50% -50%;opacity:0;transform:scale(.9);transition:opacity .25s,transform .4s var(--ease)}
.paint.full img{opacity:1;transform:none}

.follower{position:fixed;left:0;top:0;z-index:400;pointer-events:none;opacity:0;transition:opacity .3s}
.follower.on{opacity:1}
.follower span{display:grid;place-items:center;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50% 50% 50% 50%;border:2px solid var(--paint);background:rgba(94,102,56,.12);transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,border-color .3s;font-size:.72rem;font-weight:700;color:#fff;letter-spacing:.04em;text-transform:uppercase}
.follower.link span{width:62px;height:62px;margin:-31px 0 0 -31px;background:rgba(255,93,0,.18);border-color:var(--orange)}
.follower.view span{width:86px;height:86px;margin:-43px 0 0 -43px;background:var(--paint);border-color:var(--paint)}
.follower.view span::after{content:"Bekijk"}
.follower.paintmode span{width:96px;height:96px;margin:-48px 0 0 -48px;border-style:dashed;border-color:#fff;background:rgba(255,255,255,.12)}
.follower.down span{transform:scale(.8)}
@media (hover:none),(pointer:coarse){.follower{display:none}}

.toasts{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:450;display:grid;gap:10px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--cream);padding:14px 18px;border-radius:16px;box-shadow:var(--shadow-l);display:flex;gap:12px;align-items:center;animation:toastIn .5s var(--ease) both}
.toast.out{animation:toastOut .4s ease-in forwards}
.toast .ic{color:var(--orange)}
.toast b{display:block}
.toast small{opacity:.8}
@keyframes toastIn{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(20px)}}

.egg-layer{position:fixed;inset:0;z-index:440;pointer-events:none;overflow:hidden}
.egg-layer>*{position:absolute}

/* easter-egg pagina */
.eggs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.egg{background:var(--card);border-radius:var(--r-m);padding:20px;box-shadow:var(--shadow-s);border:2px dashed var(--line);display:grid;gap:6px}
.egg.found{border:2px solid var(--olive);background:linear-gradient(160deg,var(--card),rgba(185,190,156,.35))}
.egg .ic{width:30px;height:30px;color:var(--line)}
.egg.found .ic{color:var(--orange);fill:var(--orange)}
.egg b{font-family:var(--display);font-size:1.1rem}
.egg small{color:var(--ink-soft)}
.egg-bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 30px;max-width:520px}
.egg-bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width 1s var(--ease)}

/* egg-effecten */
.rainbow{animation:rainbow 6s linear}
@keyframes rainbow{to{filter:hue-rotate(720deg) saturate(1.6)}}
.retro, .retro *{font-family:"Comic Sans MS","Comic Sans",cursive!important;border-radius:0!important}
.retro body, .retro .hero, .retro .section{background:#c0c0c0!important}
.retro .btn{background:#c0c0c0!important;color:#000!important;border:3px outset #fff!important;box-shadow:none!important}
.retro h1,.retro h2{color:#00f!important;text-shadow:2px 2px #ff0}
.retro-bar{position:fixed;top:0;left:0;right:0;z-index:430;background:#000080;color:#ff0;font:700 16px "Comic Sans MS",cursive;padding:6px;white-space:nowrap;overflow:hidden;pointer-events:none}
.retro-bar span{display:inline-block;animation:scrollx 9s linear infinite;padding-left:100%}
@keyframes scrollx{to{transform:translateX(-100%)}}
.owl-fly{font:700 1.2rem var(--display);color:var(--olive-dark);display:flex;align-items:center;gap:10px;animation:owlFly 4.2s linear forwards;top:20%}
.owl-fly svg{width:110px;height:110px;animation:flap .3s ease-in-out infinite alternate}
.owl-fly span{background:#fff;padding:8px 16px;border-radius:20px 20px 20px 4px;box-shadow:var(--shadow-m)}
@keyframes owlFly{from{left:-260px;top:55%}40%{top:18%}70%{top:38%}to{left:110%;top:10%}}
@keyframes flap{to{transform:translateY(-14px) rotate(-5deg)}}
.night-eyes{right:24px;bottom:90px;display:flex;gap:10px;animation:toastIn .6s both}
.night-eyes i{width:26px;height:26px;border-radius:50%;background:#ffd84a;box-shadow:0 0 18px #ffd84a;position:relative;animation:blink 4s infinite}
.night-eyes i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#171a0d}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.worm{top:60%;animation:wormGo 9s linear forwards;display:flex;align-items:center}
.worm i{width:16px;height:16px;border-radius:50%;background:#e8b98a;border:2px solid #9b6a3c;margin-left:-5px;animation:wiggle .5s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-.1s)}
.worm i:last-child{background:#d39a63}
@keyframes wormGo{from{left:-120px}to{left:105%}}
@keyframes wiggle{to{transform:translateY(-8px)}}
.hole{width:9px;height:9px;border-radius:50%;background:#3b2a16;box-shadow:inset 1px 1px 2px #000;animation:toastIn .3s both}
.rings{inset:0;display:grid;place-items:center;background:rgba(34,38,15,.86);pointer-events:all;color:#fff;text-align:center;animation:toastIn .4s both;cursor:pointer}
.rings svg{width:min(70vmin,460px);height:auto}
.rings circle{fill:none;stroke:#d9a871;transform-origin:50% 50%;animation:ringIn .5s var(--ease) both;animation-delay:calc(var(--n)*70ms)}
@keyframes ringIn{from{opacity:0;transform:scale(.3)}}
.rings b{font:600 2rem var(--display);display:block;margin-top:14px}
.shaving{width:16px;height:34px;border:4px solid #d9a871;border-color:#d9a871 transparent transparent #d9a871;border-radius:50%;animation:fall var(--d,2.6s) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x,0),110vh) rotate(var(--r,720deg))}}
.spill{left:0;right:0;bottom:0;height:0;background:var(--paint);border-radius:60% 80% 0 0/40px 60px 0 0;animation:spill 4.5s var(--ease) forwards}
@keyframes spill{20%{height:150px}75%{height:150px;opacity:1}100%{height:150px;opacity:0;transform:translateY(100%)}}
.dry{left:50%;top:50%;translate:-50% -50%;width:min(420px,88vw);background:var(--card);color:var(--ink);padding:26px;border-radius:var(--r-m);box-shadow:var(--shadow-l);text-align:center;animation:toastIn .5s both}
.dry .bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.dry .bar i{display:block;height:100%;width:0;background:var(--paint);animation:dry 7s linear forwards}
@keyframes dry{to{width:100%}}
.knock{animation:knock .35s}
@keyframes knock{25%{transform:translate(-5px,3px) rotate(-1deg)}60%{transform:translate(4px,-2px) rotate(1deg)}}
.plank404{width:min(520px,90%);margin:30px auto;padding:44px 20px;border-radius:14px;border:0;display:block;font:600 1.6rem var(--display);color:#3b2a16;
  background:repeating-linear-gradient(92deg,#d9a871 0 14px,#cf9c64 14px 17px,#ddb07c 17px 40px,#c8935a 40px 42px);box-shadow:var(--shadow-m),inset 0 -8px 0 rgba(0,0,0,.12)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero-in,.pdp,.b2b,.contact-grid,.cart-page,.info{grid-template-columns:1fr}
  .gallery,.side{position:static}
  .guides{grid-template-columns:1fr}
  .guide{min-height:300px}
  .bento{grid-template-columns:repeat(2,1fr)}
  .tile:nth-child(n){grid-column:auto;grid-row:auto}
  .tile:nth-child(1){grid-column:span 2}
  .stats{grid-template-columns:repeat(2,1fr)}
  .footer-top{grid-template-columns:1fr 1fr}
  .hero-swatches{display:none}
  .plank{transform:none;aspect-ratio:4/3}
  .side{grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}
}
@media (max-width:640px){
  body{font-size:16px}
  .topbar-in>*:not(:first-child){display:none}
  .header-main{flex-wrap:wrap;gap:10px}
  .logo img{height:40px}
  .search{order:3;flex:1 1 100%;max-width:none}

  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card-body{padding:12px}
  .card-name{font-size:1rem}
  .footer-top{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .bigcan{grid-template-columns:90px 1fr}
  .bigcan svg{width:90px;height:100px}
  .swatch,.swatch img{width:160px}
  .swatch img{height:200px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  [data-reveal]{opacity:1;transform:none}
  .follower{display:none}
}
@media (min-width:900px){.toasts{left:24px;translate:none}}
.demo-bar{background:var(--orange);color:var(--on-orange);text-align:center;font-weight:700;font-size:.85rem;padding:5px 12px}
.logo-txt{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;color:var(--olive-dark);line-height:1;white-space:nowrap}.logo-txt em{font-style:normal;color:var(--orange)}.footer-brand .logo-txt{color:var(--cream)}
</style>

enste aantal lagen is aangebracht, laat de olie dan een paar dagen volledig drogen.</p> <p>Rendement</p> <p>Ongeveer 12 m2 per liter, afhankelijk van de zuigende werking van de ondergrond.</p>","p":1795,"r":1795,"sale":false,"stock":true,"v":[{"id":29078,"l":"250 ml","p":1795,"r":1795,"s":true},{"id":29080,"l":"1 liter","p":4495,"r":4495,"s":true},{"id":29081,"l":"5 liter","p":19900,"r":19900,"s":true}],"a":{"Inhoud":"250 ml, 1 liter, 5 liter","Kleuren":"Naturel, Blank, Transparant","Verbruik":"10 tot 12 m² / liter","Aanbrengen":"Kwast of lakroller","Geschikt voor":"Alle houtsoorten"},"opt":false},{"id":28727,"n":"Quick Color Wax – Stripped","s":"quick-color-wax-stripped","t":"simple","c":["color-wax-kleurwas","was"],"img":"","imgs":[],"sd":"<ul> <li>Beschermt, conserveert en kleurt uw houten meubelen.</li> <li>Quick Color Wax in de kleur: <strong>13 &#8211; Stripped</strong></li> <li>Ook wel Kleurwas of Decor Wax genoemd</li> <li>Ook te gebruiken voor uw vloer</li> <li>Eenvoudig te behandelen ook als u geen specialist bent</li> </ul>","d":"<p>Quick Color Wax Stripped (ook wel Kleurwas of Decor Wax genoemd) onderhoudt en beschermt uw meubelen op traditionele wijze. Zuivere bijenwas, carnaubawas en candelilla zijn in deze was gemengd naar oudhollands recept.</p> <p>Quick Color Wax is er in 9 kleuren en is vele malen kleurkrachtiger dan onze traditionele Onderhoudswas of Antiekwas. Wilt u uw meubel kleuren door middel van was? Bekijk dan eens de kleurkaart en kies uit de lichte of middenkleuren. Er zijn ook enkele donkere houtkleuren in het assortiment Color Wax.</p> <p>In combinatie met krijtverf geeft u uw meubel met Quick Color Wax een authentieke look. Als vakman of handige doe-het-zelver geeft u uw stuk die fluweelachtige uitstraling met matte finish. Een nabehandeling met onze Color Wax versterkt dat effect.</p> <p>Bent u helemaal weg van het whitewash effect? U geeft grove houtsoorten een gebleekte look met onze Color Wax in de kleuren Lime en Grey. Deze wassen bevatten kalk en witte pigmenten en kunt u ook op andere houtsoorten gebruiken voor een origineel resultaat.</p> <p>Eenvoudige behandeling</p> <p>Wrijf uw meubel of houten vloer licht in met Quick Color Wax. Voor geprofileerd hout gebruikt u een borstel. Borstel na 15 minuten de was uit en wrijf uw meubel of vloer na. Dit is niet moeilijk. Behandel altijd eerst een proefstukje om te zien of de was het gewenste resultaat geeft.</p>","p":2195,"r":2195,"sale":false,"stock":true,"v":[],"a":{"Inhoud":"Proefpotje, 370 ml","Kleuren":"Grijs, Grey Wash, Verouderd","Aanbrengen":"Borstel, Doek, Kwast","Producent":"Quick"},"opt":false},{"id":28726,"n":"Quick Color Wax French","s":"quick-color-wax-french","t":"variable","c":["color-wax-kleurwas","was"],"img":"","imgs":[],"sd":"<ul> <li>Beschermt, conserveert en kleurt uw houten meubelen.</li> <li>Quick Color Wax in de kleur: <strong>18 &#8211;</strong> <b>French</b></li> <li>Ook wel Kleurwas of Decor Wax genoemd</li> <li>Ook te gebruiken voor uw vloer</li> <li>Eenvoudig te behandelen ook als u geen specialist bent</li> </ul>","d":"<p>Quick Color Wax French (ook wel Kleurwas of Decor Wax genoemd) onderhoudt en beschermt uw meubelen op traditionele wijze. Zuivere bijenwas, carnaubawas en candelilla zijn in deze was gemengd naar oudhollands recept.</p> <p>Quick Color Wax is er in 9 kleuren en is vele malen kleurkrachtiger dan onze traditionele Onderhoudswas of Antiekwas. Wilt u uw meubel kleuren door middel van was? Bekijk dan eens de kleurkaart en kies uit de lichte of middenkleuren. Er zijn ook enkele donkere houtkleuren in het assortiment Color Wax.</p> <p>In combinatie met krijtverf geeft u uw meubel met Quick Color Wax een authentieke look. Als vakman of handige doe-het-zelver geeft u uw stuk die fluweelachtige uitstraling met matte finish. Een nabehandeling met onze Color Wax versterkt dat effect.</p> <p>Bent u helemaal weg van het whitewash effect? U geeft grove houtsoorten een gebleekte look met onze Color Wax in de kleure ntrole en comfort. Bovendien heeft deze schuurmachine een stofopvangsysteem met uitneembare zak om het werkgebied schoon te houden.</p> <ul> <li>Compacte, lichtgewicht schuurmachine met ergonomisch ontwerp voor meer comfort en controle</li> <li>1/3 vel schuurzool, ideaal voor gebruik op verticale oppervlakken zoals deuren en muren</li> <li>Voorhandgreep met rubberen grip voor meer controle en minder vermoeidheid</li> <li>Gemakkelijke klembevestiging van het schuurpapier</li> </ul>","p":5495,"r":5495,"sale":false,"stock":false,"v":[],"a":{"Geschikt voor":"Alle houtsoorten, Alle soorten plamuur en vloeibaar hout"},"opt":false},{"id":26717,"n":"Black+Decker Mouse Deltaschuurmachine","s":"blackdecker-mouse-deltaschuurmachine-bew230-qs","t":"simple","c":["elektrisch-gereedschap","gereedschap","diversen","schuurmiddelen"],"img":"","imgs":[],"sd":"<ul> <li>Schuurplateau: 100 x 110 mm</li> <li>Detailschuurmachine met 6 schuurvellen</li> <li>Klittenbandbevestiging van het schuurvel</li> <li>Veelzijdig: ideaal voor verf/lak, reinigen van glas, verwijderen van roest en schuren in moeilijke plekjes</li> <li>Rubberen grepen voor comfortabel gebruik en uitstekende controle</li> <li>Handige aan/uit schakelaar zonder de knop constant ingedrukt te moeten houden</li> </ul>","d":"<h2>Black+Decker Mouse Deltaschuurmachine BEW230-QS</h2> <p>De Black+Decker Mouse detailschuurmachine BEW230-QS is een compacte en lichte schuurmachine. Door de lage vibratie en gewicht is de langdurige bediening met één hand. Hierdoor is de machine geschikt voor horizontaal en verticaal gebruik. De schuurvellen worden bevestigt met klittenband. De Black+Decker detailschuurmachine BEW230-QS heeft een aansluiting voor stofafzuiging en is inclusief 6 schuurvellen.</p> <p>Schuurplateau: 100 x 110 mm</p> <ul> <li>Detailschuurmachine met 6 schuurvellen</li> <li>Klittenbandbevestiging van het schuurvel</li> <li>Veelzijdig: ideaal voor verf/vernis, reinigen van glas, verwijderen van roest en schuren in moeilijke plekjes</li> <li>Rubberen grepen voor comfortabel gebruik en uitstekende controle</li> <li>Handige aan/uit schakelaar zonder de knop constant ingedrukt te moeten houden</li> </ul>","p":4495,"r":4495,"sale":false,"stock":false,"v":[],"a":{"Geschikt voor":"Alle houtsoorten, Alle soorten plamuur en vloeibaar hout"},"opt":false},{"id":26575,"n":"Onderhoudsolie Weisgrund","s":"onderhoudswasolie-weisgrund","t":"variable","c":[],"img":"","imgs":[],"sd":"<ul> <li>Onderhoudsolie speciaal voor vloeren die behandeld zijn met Wasolie Weisgrund of Hardwaxolie Half Wit F750</li> <li>Ongeveer twee keer per jaar dun aanbrengen als onderhoud</li> <li>Het opfrissen van de meest belopen plekken.</li> <li>Verbruik: 70 m² per liter</li> </ul>","d":"<h2>Onderhoudsolie voor witte of whitewash houten vloeren en meubels</h2> <p>Onderhoudswasolie Weisgrund is zeer belangrijk voor het onderhouden van uw vloer of meubelstuk. Bij standaard onderhoud bevelen we aan om uw vloer of meubelstuk <strong>twee keer per jaar</strong> een opfrisbeurt te geven met de Onderhoudswasolie. De Onderhoudswasolie Weisgrund heeft een lagere viscositeit (stroperigheid) en daardoor brengt u maar een dun nieuw laagje olie aan, i.p.v. een nieuwe dikke laag. Met de Onderhoudswasolie gaat u als het ware het verlies van olie door slijtage en schoonmaken tegen.</p> Gebruiksaanwijzing <p>Maak de vloer of uw meubelstuk eerst goed stofvrij. Hierbij is vochtig reinigen niet aanbevolen aangezien het de opname van de olie kan verstoren. Voor gebruik moet u de onderhoudswasolie goed schudden of roeren, waarna opbrengen met borstel of kwast. De onderhoudswasolie zeer dun en gelijkmatig aanbrengen en overtollige olie direct verwijderen met een niet pluizende doek en <strong>NIET</strong> laten indrogen. Droogtijd is ongeveer 12 uur. Daarna kan de vloer weer gewoon belopen worden en het meubelstuk weer gewoon gebruikt worden. De eerste twee weken geen reiniging of onderhoudsmiddelen aanbrengen.</p>","p":2995,"r":2995,"sale":false,"stock":false,"v":[{"id":26576,"l":"1 liter","p":2995,"r":2995,"s":false}],"a":{"Inhoud":"250 ml, 500 ml, 1 liter","Kleuren":"Naturel Mat"},"opt":false},{"id":25363,"n":"Gestookte Jachtlak | Lacq","s":"gestookte-jachtlak-lacq","t":"variable","c":[],"img":"","imgs":[],"sd":"<ul> <li>Traditioneel gestookte jachtlak</li> <li>Voor jachten en boten (ook voor deuren en tuinmeubels)</li> <li>Extreem weers- en waterbestendig</li> <li>Optimaal waterbestendig</li> <li>Krachtig uv-filter</li> <li>Hoge elasticiteit</li> <li>Scheurt niet op werkend hout</li> <li>Volle, bolle of hoge glans</li> </ul>","d":"<p>De op ambachtelijke wijze gestookte Jachtlak blinkt uit door een optimale vloeiing, bolle glans, zeer hoge weer- en waterbestendigheid en hoge elasticiteit waardoor de lak niet scheurt op werkend hout. Lacq gestookte Jachtlak is onder andere gebaseerd op houtolie en phenolhars, maar bevat tevens een hoogwaardige UV-filter die optimaal beschermt tegen verkleuring door zonlicht, ook in tropische klimaten.</p> <p>Toepasbaar (in de boten &amp; jachtbouw) op:<br> • Boten<br> • Kozijnen<br> • Deuren<br> • Meubelafwerking</p> <p>Voor nieuw werk op massief kaalhout (zoals mahonie, meranti, oregon pine), hecht hout binnen en buiten boven de waterlijn. Als onderhoud aan bestaande één-en tweecompontent vernissystemen die nog in tact zijn. Tevens wordt de gestookte jachtlak vaak toegepast voor het afwerken van voordeuren en tuinmeubelen.</p>","p":2295,"r":2295,"sale":false,"stock":false,"v":[{"id":25368,"l":"500 ml","p":2295,"r":2295,"s":false},{"id":25367,"l":"1 liter","p":3895,"r":3895,"s":false},{"id":25366,"l":"2,5 liter","p":9315,"r":9315,"s":false},{"id":25365,"l":"5 liter","p":17495,"r":17495,"s":false},{"id":25364,"l":"20 liter","p":67980,"r":67980,"s":false}],"a":{"Inhoud":"2,5 liter, 20 liter, 500 ml, 1 liter, 5 liter","Geschikt voor":"Alle houtsoorten","Aanbrengen":"Conventionele luchtspuit, Langharige slappe kwast","Droogtijden":"24 uur","Verbruik":"12 tot 15 m² / liter"},"opt":false},{"id":24998,"n":"Fluxaf Green – milieuvriendelijk afbijtmiddel | Lacq","s":"fluxaf-green-lacq-milieuvriendelijk-afbijtmiddel","t":"variable","c":["onderhoudsmiddelen-en-reparatie","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Milieu vriendelijke professioneel afbijtmiddel</li> <li>Verwijderd o.a.: Verf en Sierpleisters</li> <li>Bevat geen zuren, logen, gevaarlijke stoffen (zoals NMP), paraffine of conserveringsmiddelen</li> <li>Kan zelfs toegepast worden op plafonds</li> <li>Kan ook gebruikt worden onder de 0℃</li> </ul>","d":"<h2>Fluxaf Green verwijdert alle soorten verf en sierpleister</h2> <p>Fluxaf Green is een milieuvriendelijk afbijtmiddel wat geschikt is voor het verwijderen van de meeste soorten verf van bijna alle oppervlakken. Fluxaf Green is PH-neutraal en bevat geen gevaarlijke stoffen (zoals NMP), paraffine of conserveringsmiddelen en is daarom absoluut veilig om zowel binnen als buiten te gebruiken. Fluxaf Green kan ook worden gebruikt als de temperatuur onder de 0℃ is. Dankzij de unieke structuur kan Fluxaf Green zelfs toegepast worden op plafonds.</p> <p>Toepasbaar op onder andere: Beton, Natuursteen, Hout, Metaal (inclusief lichtmetalen) en Koper</p> <p>Verwijderd o.a.: Verf en Sierpleisters</p> <p>Plastic zal in het algemeen aangetast worden</p>","p":2795,"r":2795,"sale":false,"stock":false,"v":[{"id":25000,"l":"1 liter","p":2795,"r":2795,"s":true},{"id":24999,"l":"2,5 liter","p":6490,"r":6490,"s":true}],"a":{"Inhoud":"2,5 liter, 500 ml, 1 liter","Geschikt voor":"Alle houtsoorten, Beton en Sierpleister, Koper, Metaal (incl. lichtmetaal), Verf","Aanbrengen":"Kwast"},"opt":false},{"id":24989,"n":"Turbogel | Lacq","s":"lacq-turbogel","t":"variable","c":["onderhoudsmiddelen-en-reparatie"],"img":"","imgs":[],"sd":"<ul> <li>Herstelt de natuurlijke kleur van houten meubels, vlonders en steigers</li> <li>Lacq Turbogel bevat biologisch afbreekbaar oxaalzuur (&lt;10%).</li> <li>Het product is vrij van oplosmiddelen, formaldehyde, chloorverbindinge g":"","imgs":[],"sd":"<ul> <li>Patine in de kleur: Wit</li> <li>Verbruik: 1 liter per 12 tot 15 vierkante meter</li> <li>Eenvoudig aan te brengen met kwast of spons</li> </ul>","d":"<h3>Patine Verouderingsbeits Waterbasis Wit – Voor een Authentiek Verweerd Effect</h3> <p>De <strong>Patine Wit van Demo Meubelwebshop</strong> is dé keuze voor wie houten meubels, vloeren en accessoires een karakteristiek, rustiek uiterlijk wil geven. Deze hoogwaardige, watergedragen patine creëert moeiteloos een oud en verweerd effect, waardoor hout een nostalgische en unieke uitstraling krijgt. Perfect voor zowel moderne als klassieke interieurs!</p> <h4><strong>Geschikt voor Alle Houtsoorten</strong></h4> <p>Deze patine is geschikt voor elk type hout en vormt de ideale basis voor een duurzame afwerking. Voor bescherming tegen water en vuil adviseren we een afwerking met <strong>Hardwaxolie</strong>, <strong>Waterlak</strong>, of een <strong>2K-lak</strong>.</p> <h3>Waarom Kiezen voor Patine Wit?</h3> <ul> <li><strong>Unieke uitstraling:</strong> Creëer een authentiek verouderd effect.</li> <li><strong>Breed toepasbaar:</strong> Geschikt voor meubels, vloeren en meer.</li> <li><strong>Duurzaam:</strong> Combineer met een beschermende lak of olie voor extra bestendigheid.</li> </ul> <p>Breng sfeer en karakter in je interieur met deze patine! Ontdek nu hoe je jouw houten oppervlakken een exclusieve make-over geeft.</p>","p":1495,"r":1495,"sale":false,"stock":true,"v":[{"id":40358,"l":"250 ml","p":1495,"r":1495,"s":true},{"id":24022,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":24023,"l":"5 liter","p":13495,"r":13495,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Aanbrengen":"Spons of doek","Verbruik":"12 – 15 m² / liter","Kleuren":"Wit, White Wash"},"opt":false},{"id":23611,"n":"Tenco Hardhout ontgrijzer","s":"tenco-hardhout-ontgrijzer","t":"simple","c":["onderhoudsmiddelen-en-reparatie"],"img":"","imgs":[],"sd":"<ul> <li>Herstelt de natuurlijke kleur van hardhout</li> <li>Inhoud: 1000 ml</li> <li>Afhankelijk van de mate van vergrijzing en vervuiling. Met ca. 1 liter kan<br> één tuintafel en 4 stoelen behandeld worden.</li> <li>Gemakkelijk verwerkbaar</li> </ul>","d":"<p>Tenco Hardhoutontgrijzer verwijdert de aanwezige grauwsluier en herstelt de oorspronkelijke kleur van het hout. Tenco Hardhoutontgrijzer wordt gebruikt om vergrijsde en vervuilde hardhouten tuinmeubelen schoon te maken zodat de oorspronkelijke kleur van het hardhout weer zichtbaar wordt.</p> <p>Breng de Tenco Hardhoutontgrijzer aan met een kwast zodanig dat alle delen voldoende geraakt worden. Tenco Hardhoutontgrijzer ca. 15 minuten laten inwerken. Het vuil wordt losgeweekt en het hout is al zichtbaar ontgrijst. Het losgekomen vuil verwijderen met een schuurspons of een harde borstel. Gebruik hierbij overvloedig water (let op met spatten). Indien noodzakelijk de behandeling herhalen voor een nog beter resultaat. Daarna de tuinmeubelen goed laten drogen. De hardhouten tuinmeubelen afwerken met Tenco Hardhoutolie of een Tenco Tuinmeubel Beits in de gewenste transparantie kleur.</p>","p":1195,"r":1195,"sale":false,"stock":false,"v":[],"a":{"Inhoud":"1 liter","Kleuren":"Transparant","Geschikt voor":"(Hardhouten) buitenmeubilair","Aanbrengen":"Kwast","Droogtijden":"Inwerktijd ca. 15 minuten","Verbruik":"1 tuintafel + 4 stoelen (afhankelijk van de mate van vergrijzing en vervuiling)"},"opt":false},{"id":21936,"n":"Bleko Ontweringswater","s":"ontweringswater-bleko","t":"simple","c":["onderhoudsmiddelen-en-reparatie","schoonmaken"],"img":"","imgs":[],"sd":"<ul> <li>Reinigingsmiddel voor verweerd hout</li> <li>Verwijderen van vlekken in hout</li> <li>Voorkomen van groene aanslag op houten tuinmeubelen</li> <li>500 ml per fles</li> </ul>","d":"<p><b>Reinigingsmiddel voor verweerd hout<br> </b>Hout kan verweren door de inwerking van vocht. Hierdoor kunnen op het hout zwarte vlekken ontstaan. Dit is vooral het geval bij hout dat onbeschermd is. Wanneer er beschadigingen zijn aan het schilderwerk of wanneer hout niet voldoende behandelt is met lak, beits of olie is de kans groot dat hout gaat verweren wanneer het regelmatig met vocht in aanraking komt. De donkergekleurde vlekken kunnen met ontweringswater worden verwijdert.</p> <p>Ontweringswater kan ook worden gebruikt voor het verwijderen van groene aanslag van houten schuttingen en tuinmeubelen. Daarnaast kan het vergrijzen van houten tuinmeubels worden verminderd door het te reinigen met ontweringswater.</p> <p><b>Hoe werkt ontweringswater?<br> </b>In hout ontstaat ‘het weer’ de oxidatieprocessen van de polyfenolen (chemische verbindingen) die in het hout voorkomen. Deze polyfenolen worden tijdens de oxidatie omgezet tot chinonen (organische verbindingen). De polyfenolen hebben geen kleur maar de chinonen hebben wel een duidelijke bruine kleur. Door het oxidatieproces worden uiteindelijk na geruime tijd nieuwe ‘producten’ gevormd die er voor zorgen dat er verkleuring optreed.</p> <p>Het oxaalzuur in het ontweringswater kan als reductor worden gebruikt. Oxaalzuur zet de chinonen weer om in fenolen hierdoor kan de verkleuring weer ongedaan worden gemaakt. Oxaalzuur is echter niet meer effectief wanneer het oxidatieproces te ver gevorderd is en de uiteindelijke reactieproducten zijn gevormd.</p>","p":285,"r":285,"sale":false,"stock":false,"v":[],"a":{"Inhoud":"500 ml, 1 liter","Geschikt voor":"Alle houtsoorten","Aanbrengen":"Kwast of doek"},"opt":false},{"id":20752,"n":"Wasbeits Koloniaal (zuivere bijenwas)","s":"wasbeits-koloniaal-zuivere-bijenwas","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder oplosmiddelen</li> <li>Natuurzuiver bijenwas product in de kleur: Koloniaal</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<h3><strong>Watergedragen Wasbeits Koloniaal met Natuurlijke Bijenwas voor een Authentieke, Natuurlijke Look</strong></h3> <p>Ontdek de schoonheid van hout met <strong>Watergedragen Wasbeits Koloniaal</strong> – een hoogwaardige, natuurzuivere wasbeits met bijenwas in de kleur Koloniaal. Onze Wasbeits is speciaal ontwikkeld met oog voor duurzaamheid en bevat geen schadelijke ammoniak. In plaats daarvan maken we gebruik van een natuurvriendelijk alternatief, wat deze beits een veilige keuze maakt voor u en het milieu.</p> <p>De <strong>Wasbeits Koloniaal</strong> creëert een rijke, natuurlijke uitstraling en is perfect voor het behandelen van allerlei houtsoorten, van meubels tot decoratieve houten oppervlakken. De diepte en helderheid van de Koloniale kleur brengen het hout prachtig tot leven, zonder een onnatuurlijke glans. Let wel: deze beits is niet geschikt om te bedekken met een laklaag, wat het product uitermate geschikt maakt voor wie houdt van een pure, matte afwerking. Voor bescherming en onderhoud adviseren wij het gebruik van onze Boenwas of Antiekwas.</p> <h3><strong>Waarom Kiezen voor Wasbeits Koloniaal met Bijenwas?</strong></h3> <ul> <li><strong>Duurzaam en Milieuvriendelijk</strong>: Gemaakt met natuurzuivere bijenwas en zonder ammoniak.</li> <li><strong>Prachtige, Natuurlijke Uitstraling</strong>: Geeft een rijke Koloniale kleur aan het hout en accentueert de nerven.</li> <li><strong>Breed Toepasbaar</strong>: Geschikt voor vrijwel alle houtsoorten, van eiken tot grenen meubels.</li> <li><strong>Onderhoudsvriendelijk</strong>: Eenvoudig bij te werken met onze Blanke Boenwas voor langdurige glans.</li> </ul> <h3><strong>Gebruiksaanwijzing Wasbeits Koloniaal</strong></h3> <p>Volg deze stappen voor een perfect resultaat:</p> <ol> <li><strong>Voorbereiding</strong>: Schuur het hout eerst goed op om een egaal oppervlak te krijgen.</li> <li><strong>Aanbrengen van de Wasbeits</strong>: Breng de Wasbeits Koloniaal met een kwast aan en verdeel deze gelijkmatig.</li> <li><strong>Drogen</strong>: Laat de beits 6 uur drogen bij kamertemperatuur (20°C) voor het beste resultaat.</li> <li><strong>Uitboenen voor Glans</strong>: Na droging de beits goed uitboenen met een zachte doek voor een diepe, natuurlijke glans.</li> <li><strong>Afwerking met Boenwas</strong>: Wilt u extra bescherming en onderhoud? Werk af met onze Blanke Boenwas om de kleur en glans te behouden.</li> </ol> <h3><strong>Geef Uw Meubels de Authentieke Koloniale Uitstraling met Wasbeits Koloniaal</strong></h3> <p>Breng de sfeer van authentieke houtafwerking in huis met <strong>Watergedragen Wasbeits Koloniaal</strong>. Perfect voor wie houdt van een natuurlijke look met karakter. Bestel nu en geniet van langdurige kwaliteit, milieuvriendelijkheid en de bijzondere uitstraling die onze Wasbeits aan uw hout geeft!</p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40382,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20754,"l":"1 liter","p":2995,"r":2995,"s":true},{"id":20756,"l":"5 liter","p":12595,"r":12595,"s":true}],"a":{"Inhoud":"Proefpotje, 250 ml, 500 ml, 1 liter, 5 liter","Kleuren":"Koloniaal","Aanbrengen":"Kwast","Droogtijden":"De beits 6 uur laten drogen bij een temperatuur van 20ºC en daarna zeer goed uitboenen.","Verbruik":"15 m² / liter"},"opt":false},{"id":20747,"n":"Wasbeits Noten (zuivere bijenwas)","s":"wasbeits-noten-zuivere-bijenwas","t":"variable","c":["hout-kleuren-met-oneindig-veel-kleuren","wasbeits-zuivere-bijenwas"],"img":"","imgs":[],"sd":"<ul> <li><b>NIEUWE RECEPTUUR!</b></li> <li>Zonder oplosmiddelen</li> <li>Natuurzuiver bijenwas product in de kleur: Noten</li> <li>Geeft uw meubelstuk een mooie glans na uitborstelen.</li> <li>Verbruik: 1 liter per 15 vierkante meter.</li> </ul>","d":"<p><strong>Noten Wasbeits &#8211; Natuurlijke Glans voor Houten Meubels en Vloeren</strong></p> <h3>Geef uw Hout een Authentieke, Natuurlijke Uitstraling met Noten Wasbeits</h3> <p>Noten Wasbeits is de perfecte keuze voor een duurzame, decoratieve houtbehandeling. Deze hoogwaardige beits is gemaakt van natuurzuivere bijenwas en natuurlijke pigmenten, ideaal voor diverse houtsoorten. Zonder schadelijke oplosmiddelen biedt Noten Wasbeits een milieuvriendelijke manier om hout nieuw leven in te blazen, met een warme, notenhouten uitstraling.</p> <h3>Waarom Kiezen voor Noten Wasbeits?</h3> <p>Onze Noten Wasbeits is met zorg geformuleerd op basis van een vernieuwd, duurzaam recept, wat zorgt voor een langdurige kleurintensiteit en een mooie, natuurlijke glans. Met zijn unieke samenstelling is het product ideaal voor zowel houten meubels als vloeren, en creëert het een warme uitstraling die elk interieur verrijkt. Let wel, over deze wasbeits is het niet nodig of wenselijk om een laklaag aan te brengen – de glans komt volledig tot zijn recht na een goede, grondige uitborsteling.</p> <h3>Toepassing van Noten Wasbeits</h3> <ol> <li><strong>Voorbereiding</strong>: Schuur het houtoppervlak zorgvuldig voor een optimale hechting van de wasbeits.</li> <li><strong>Aanbrengen</strong>: Gebruik een kwast om de Noten Wasbeits egaal aan te brengen.</li> <li><strong>Droogtijd</strong>: Laat de beits minimaal 6 uur drogen bij kamertemperatuur (20ºC).</li> <li><strong>Polijsten</strong>: Boen de wasbeits grondig uit voor een prachtige, natuurlijke glans.</li> </ol> <h3>Onderhoud en Extra Bescherming</h3> <p>Voor langdurig onderhoud en extra bescherming van uw houten meubel of vloer, raden we het gebruik van Blanke Boenwas of Antiekwas aan. Deze producten helpen om de natuurlijke uitstraling van het hout te behouden en bieden extra bescherming tegen slijtage.</p> <p><strong>Kies voor de Authentieke Kracht van Natuurzuivere Noten Wasbeits</strong> Noten Wasbeits is dé oplossing voor wie op zoek is naar een duurzame, natuurlijke en ambachtelijke afwerking voor houten oppervlakken. Laat uw hout stralen en geniet van een langdurige, rijke glans.</p>","p":1695,"r":1695,"sale":false,"stock":true,"v":[{"id":40383,"l":"250 ml","p":1695,"r":1695,"s":true},{"id":20749,"l":"1 liter","p":2995,"r":2995,"
